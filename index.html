  // ---------------------------------------------------------------------
  // Swipe handling for the drawer
  // ---------------------------------------------------------------------
  function bindSwipeOpen(el) {
    var startX = null;
    el.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
    el.addEventListener('touchend', function (e) {
      if (startX === null) return;
      var endX = e.changedTouches[0].clientX;
      if (endX - startX > 45) { state.drawerOpen = true; render(); }
      startX = null;
    }, { passive: true });
  }
  function bindSwipeClose(el) {
    var startX = null;
    el.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
    el.addEventListener('touchend', function (e) {
      if (startX === null) return;
      var endX = e.changedTouches[0].clientX;
      if (startX - endX > 45) { state.drawerOpen = false; render(); }
      startX = null;
    }, { passive: true });
  }

  // ---------------------------------------------------------------------
  // Drag-to-reorder for places (touch-based)
  // ---------------------------------------------------------------------
  var dragActive = false;      // while true, render() is deferred so the dragged row is never destroyed
  var renderPending = false;

  function bindDragHandle(handleEl) {
    var placeId = handleEl.getAttribute('data-drag-handle');
    handleEl.addEventListener('pointerdown', function (e) {
      if (e.button != null && e.button !== 0 && e.pointerType === 'mouse') return;
      var list = document.getElementById('placesList');
      if (!list) return;
      e.preventDefault();

      var rows = Array.prototype.slice.call(list.querySelectorAll('.place-row'));
      var startIdx = -1;
      rows.forEach(function (r, i) { if (r.getAttribute('data-place-id') === placeId) startIdx = i; });
      if (startIdx < 0) return;

      // Measure everything once, before anything moves
      var rects = rows.map(function (r) { var b = r.getBoundingClientRect(); return { top: b.top, height: b.height }; });
      var gap = 7;
      var startY = e.clientY;
      var dragRow = rows[startIdx];
      var dragH = rects[startIdx].height + gap;
      var targetIdx = startIdx;

      dragActive = true;
      dragRow.classList.add('dragging');
      dragRow.style.zIndex = '5';
      dragRow.style.transition = 'none';
      rows.forEach(function (r, i) { if (i !== startIdx) r.style.transition = 'transform 0.15s ease'; });
      try { if (handleEl.setPointerCapture && e.pointerId != null) handleEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }

      function onMove(ev) {
        var dy = ev.clientY - startY;
        // keep the dragged row inside the list
        var minDy = rects[0].top - rects[startIdx].top;
        var maxDy = (rects[rects.length - 1].top + rects[rects.length - 1].height) - (rects[startIdx].top + rects[startIdx].height);
        dy = Math.max(minDy, Math.min(maxDy, dy));
        dragRow.style.transform = 'translateY(' + dy + 'px)';

        // Use the dragged row's leading edge (bottom when moving down, top when moving up),
        // so dragging all the way to either end always passes the last/first row.
        var edgeTop = rects[startIdx].top + dy;
        var edgeBottom = edgeTop + rects[startIdx].height;
        var t = startIdx;
        rows.forEach(function (r, i) {
          if (i === startIdx) return;
          var mid = rects[i].top + rects[i].height / 2;
          var shift = 0;
          if (i > startIdx && edgeBottom > mid) { shift = -dragH; t = Math.max(t, i); }
          else if (i < startIdx && edgeTop < mid) { shift = dragH; t = Math.min(t, i); }
          r.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
        });
        targetIdx = t;
      }

      function finish(commit) {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onCancel);
        try { if (handleEl.releasePointerCapture && e.pointerId != null) handleEl.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        dragActive = false;
        if (commit && targetIdx !== startIdx) {
          var ids = rows.map(function (r) { return r.getAttribute('data-place-id'); });
          var moved = ids.splice(startIdx, 1)[0];
          ids.splice(targetIdx, 0, moved);
          commitPlacesOrder(ids);   // re-renders
        } else {
          renderPending = false;
          render();
        }
      }
      function onUp() { finish(true); }
      function onCancel() { finish(false); }

      window.addEventListener('pointermove', onMove);

<script>
(function () {
  "use strict";
  var root = null;                                   // the shadow root the expense app lives in
  function $(id) { return root.getElementById(id); }

  var TAX_THRESHOLD = 5000;   // yen, tax-excluded, per store per day (Japan Tourism Agency, refund method from 2026-11-01)
  var CATEGORIES = [
    { label: '餐飲', goods: false }, { label: '交通', goods: false }, { label: '住宿', goods: false },
    { label: '門票體驗', goods: false }, { label: '購物', goods: true }, { label: '藥妝', goods: true },
    { label: '伴手禮', goods: true }, { label: '其他', goods: true }
  ];

  // ------------------------------------------------------------------ helpers
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fmtInt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function fmtYen(n) { return '¥' + fmtInt(n); }
  function fmtTwd(n) { return 'NT$' + fmtInt(n); }
  function fmtDate(iso) {
    var p = String(iso || '').split('-'); if (p.length !== 3) return iso || '';
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return p[1] + '/' + p[2] + '（' + '日一二三四五六'.charAt(d.getDay()) + '）';
  }
  function ymd(d) {
    var m = String(d.getMonth() + 1), day = String(d.getDate());
    return d.getFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-' + (day.length < 2 ? '0' + day : day);
  }
  function todayStr() { return ymd(new Date()); }
  function addDays(iso, n) { var p = iso.split('-'); return ymd(new Date(+p[0], +p[1] - 1, +p[2] + n)); }
  function isDateStr(x) { return typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x); }
  function isGoods(cat) { for (var i = 0; i < CATEGORIES.length; i++) { if (CATEGORIES[i].label === cat) return CATEGORIES[i].goods; } return false; }
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* ignore */ } }

  // ------------------------------------------------------------------ calculations (pure)
  function minorOf(amount, cur) { return cur === 'JPY' ? Math.round(amount) : Math.round(amount * 100); }
  function splitMinor(total, ids) {
    var out = {}, n = ids.length; if (!n) return out;
    var base = Math.floor(total / n), rem = total - base * n;
    ids.forEach(function (id, i) { out[id] = base + (i < rem ? 1 : 0); });
    return out;
  }
  function expenseTwd(e) { return e.currency === 'JPY' ? e.amount * e.rate : e.amount; }
  function shareTwd(e, minor) { return e.currency === 'JPY' ? minor * e.rate : minor / 100; }

  function computeBalances(expenses, members) {
    var bal = {};
    members.forEach(function (m) { bal[m.id] = { paid: 0, owed: 0 }; });
    expenses.forEach(function (e) {
      var parts = (e.participantIds || []).filter(function (id) { return bal[id]; });
      var shares = splitMinor(minorOf(e.amount, e.currency), parts);
      if (bal[e.payerId]) bal[e.payerId].paid += expenseTwd(e);
      parts.forEach(function (id) { bal[id].owed += shareTwd(e, shares[id]); });
    });
    Object.keys(bal).forEach(function (id) { bal[id].net = bal[id].paid - bal[id].owed; });
    return bal;
  }
  function settlements(bal) {
    var cred = [], debt = [];
    Object.keys(bal).forEach(function (id) {
      var n = bal[id].net;
      if (n > 0.5) cred.push({ id: id, amt: n }); else if (n < -0.5) debt.push({ id: id, amt: -n });
    });
    cred.sort(function (a, b) { return b.amt - a.amt; });
    debt.sort(function (a, b) { return b.amt - a.amt; });
    var out = [], i = 0, j = 0;
    while (i < debt.length && j < cred.length) {
      var x = Math.min(debt[i].amt, cred[j].amt);
      out.push({ from: debt[i].id, to: cred[j].id, amount: Math.round(x) });
      debt[i].amt -= x; cred[j].amt -= x;
      if (debt[i].amt < 0.5) i++;
      if (cred[j].amt < 0.5) j++;
    }
    return out.filter(function (t) { return t.amount > 0; });
  }

  function taxInfo(e) {
    if (!e.taxFree || e.currency !== 'JPY') return null;
    var pre = Math.round(e.amount / (1 + (Number(e.taxRate) || 10) / 100));
    return { pretax: pre, tax: e.amount - pre };
  }
  function taxGroups(expenses) {
    var map = {}, list = [];
    expenses.forEach(function (e) {
      var t = taxInfo(e); if (!t) return;
      var store = String(e.store || '').trim() || '（未填店名）';
      var key = e.date + '|' + store.toLowerCase();
      if (!map[key]) { map[key] = { key: key, date: e.date, store: store, pretax: 0, entries: [], refundYen: 0, refundTwd: 0, eligible: false }; list.push(map[key]); }
      map[key].pretax += t.pretax; map[key].entries.push(e);
    });
    list.forEach(function (g) {

  // ---- accordion (how-to card and each day) ----
  function accClosedSet() { try { var a = JSON.parse(lsGet('expenses.accClosed') || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function isAccClosed(id) { return accClosedSet().indexOf(id) > -1; }
  function setAccClosed(id, closed) {
    var set = accClosedSet().filter(function (x) { return x !== id; });
    if (closed) set.push(id);
    lsSet('expenses.accClosed', JSON.stringify(set));
  }
  function accHtml(id, headInner, actions, body, cls) {
    var closed = isAccClosed(id);
    return '<div class="acc' + (closed ? '' : ' open') + (cls ? ' ' + cls : '') + '" data-acc="' + esc(id) + '">' +
      '<div class="acc-head"><button class="acc-toggle" data-acc-toggle aria-expanded="' + (closed ? 'false' : 'true') + '"><span class="chev">▾</span>' + headInner + '</button>' + (actions || '') + '</div>' +
      '<div class="acc-body" style="max-height:' + (closed ? '0' : 'none') + '"><div class="acc-inner">' + body + '</div></div></div>';
  }
  function toggleAcc(card) {
    if (!card) return;
    var id = card.getAttribute('data-acc'), body = card.querySelector('.acc-body'), btn = card.querySelector('[data-acc-toggle]');
    var open = !card.classList.contains('open');
    card.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    setAccClosed(id, !open);
    if (open) { body.style.maxHeight = body.scrollHeight + 'px'; setTimeout(function () { if (card.classList.contains('open')) body.style.maxHeight = 'none'; }, 280); }
    else { body.style.maxHeight = body.scrollHeight + 'px'; void body.offsetHeight; body.style.maxHeight = '0px'; }
  }

  function howtoCard() {
    return accHtml('howto', '<span class="acc-text"><span class="acc-title">怎麼用</span></span>', '',
      '<ol class="steps">' +
        '<li>先到「設定」新增旅伴，並填好預設匯率（1 日圓 = 幾台幣）。資料會同步，家人打開同一個網址就看到同一份</li>' +
        '<li>按右下角「<b>＋ 新的一天</b>」新增旅行的日期，一天一天加。每一天是一個大項目，可以收合</li>' +
        '<li>在某一天右邊按「＋」，或按右下角「＋ 記一筆」：填金額，選<b>誰付的</b>、<b>誰要分攤</b>。日期直接從已新增的天數裡選</li>' +
        '<li>「結算」會算出每個人該收或該付多少，並列出怎麼轉帳最省事</li>' +
        '<li>在免稅店買的東西，記帳時勾「在免稅店購買」並填店名。「退稅」分頁會幫你看有沒有達到 ¥5,000</li>' +
        '<li>看不懂收據，或離境要辦退稅？點畫面<b>左側的小把手</b>，打開「對照表與退稅小抄」</li></ol>', 'card');
  }
  function dayCard(date, list) {
    var total = list.reduce(function (sum, e) { return sum + expenseTwd(e); }, 0);
    var head = '<span class="acc-text"><span class="acc-title">' + esc(fmtDate(date)) + '</span><span class="acc-sub">' + list.length + ' 筆 · ' + fmtTwd(total) + '</span></span>';
    var actions = '<button class="btn small" data-day-add="' + date + '" aria-label="在這天記一筆">＋</button><button class="btn ghost small" data-day-menu="' + date + '" aria-label="這天的選項">⋯</button>';
    var body = list.length ? list.map(expRow).join('') : '<div class="empty" style="padding:10px 0 14px">這天還沒有帳目，按上面的「＋」記一筆</div>';
    return accHtml('day:' + date, head, actions, body, 'dayacc');
  }
  function viewList() {
    if (!state.members.length) return howtoCard() + viewOnboarding();
    var exps = sortedExpenses();
    var total = exps.reduce(function (sum, e) { return sum + expenseTwd(e); }, 0);
    var html = howtoCard() + '<div class="card"><div class="muted">目前總花費（換算台幣）</div><div class="big">' + fmtTwd(total) + '</div><div class="muted">共 ' + state.days.length + ' 天、' + exps.length + ' 筆</div></div>';
    if (!state.days.length) return html + '<div class="empty">還沒有任何一天。先按右下角「＋ 新的一天」，再開始記帳</div>';
    var byDate = {};
    exps.forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });
    state.days.slice().reverse().forEach(function (d) { html += dayCard(d, byDate[d] || []); });
    return html;
  }
  function viewSettle() {
    if (!state.members.length) return viewOnboarding();
    var bal = computeBalances(state.expenses, state.members);
    var rows = state.members.map(function (m) {
      var b = bal[m.id]; var net = Math.round(b.net);
      var cls = net > 0 ? 'pos' : net < 0 ? 'neg' : '';
      var txt = net > 0 ? '應收 ' + fmtTwd(net) : net < 0 ? '應付 ' + fmtTwd(-net) : '打平';
      return '<tr><td>' + esc(m.name) + '</td><td>' + fmtTwd(b.paid) + '</td><td>' + fmtTwd(b.owed) + '</td><td class="' + cls + '">' + txt + '</td></tr>';
    }).join('');
    var xf = settlements(bal);
    var xfHtml = xf.length
      ? xf.map(function (t) { return '<div class="xfer"><span><b>' + esc(memberName(t.from)) + '</b> 付給 <b>' + esc(memberName(t.to)) + '</b></span><b>' + fmtTwd(t.amount) + '</b></div>'; }).join('')
      : '<div class="empty" style="padding:14px 0 4px">目前不需要互相轉帳</div>';
    return '<div class="card"><h3>每個人的收支（台幣）</h3><table class="bal"><tr><th>旅伴</th><th>已付</th><th>應分攤</th><th>結果</th></tr>' + rows + '</table></div>' +
      '<div class="card"><h3>怎麼轉帳最省事</h3>' + xfHtml +
      '<div class="muted" style="margin-top:10px">每筆帳都用記帳當下鎖定的匯率換成台幣。轉帳金額四捨五入到整數，可能有 NT$1～2 的誤差。</div></div>';
  }
  function viewTax() {
    var groups = taxGroups(state.expenses);
    var yen = 0, twd = 0;
    groups.forEach(function (g) { yen += g.refundYen; twd += g.refundTwd; });
    var html = '<div class="card"><div class="muted">預估可退稅金</div><div class="big">' + fmtYen(yen) + '</div><div class="muted">約 ' + fmtTwd(twd) + '。已排除未達門檻、已用掉的；未扣店家可能收的手續費。</div></div>';
    if (!groups.length) {
      html += '<div class="empty">還沒有免稅購物的帳目。記帳時勾選「在免稅店購買」，就會出現在這裡。</div>';
    }
    groups.forEach(function (g) {
      var pct = Math.min(100, Math.round(g.pretax / TAX_THRESHOLD * 100));
      var status = g.eligible ? '<span class="pos">已達門檻</span>' : '<span class="neg">還差 ' + fmtYen(TAX_THRESHOLD - g.pretax) + '（未稅）</span>';
      var items = g.entries.map(function (e) {
        var t = taxInfo(e);
        return '<div class="mrow"><span>' + esc(e.title) + (e.consumed ? '<span class="tag gray">已用掉，不退</span>' : '') + '<div class="muted">含稅 ' + fmtYen(e.amount) + '，稅 ' + fmtYen(t.tax) + '（' + (Number(e.taxRate) || 10) + '%）</div></span><button class="btn ghost small" data-edit="' + e.id + '">編輯</button></div>';
      }).join('');
      html += '<div class="card"><h3>' + esc(g.store) + ' · ' + esc(fmtDate(g.date)) + '</h3><div class="muted">未稅合計 ' + fmtYen(g.pretax) + ' / ' + fmtYen(TAX_THRESHOLD) + '　' + status + '</div><div class="bar' + (g.eligible ? ' ok' : '') + '"><i style="width:' + pct + '%"></i></div>' + items +
        (g.eligible ? '<div class="muted" style="margin-top:6px">這家店預估可退 ' + fmtYen(g.refundYen) + '</div>' : '') + '</div>';
    });
    html += '<div class="card"><h3>看不懂收據，或要辦離境退稅？</h3><div class="muted">收據對照表、離境當天檢查清單、記帳時的重點，都收在左側的抽屜裡。</div><div style="margin-top:10px"><button class="btn small" data-open-drawer>打開對照表與退稅小抄</button></div></div>';
    return html;
  }
  function viewSettings() {
    var meOpts = '<option value="">（不指定）</option>' + state.members.map(function (m) {
      return '<option value="' + m.id + '"' + (lsGet('expenses.me') === m.id ? ' selected' : '') + '>' + esc(m.name) + '</option>';
    }).join('');
    return membersCard() +
      '<div class="card"><h3>我是誰</h3><div class="muted">這支手機記帳時，「誰付的」會預設成這個人（只存在這支手機）。</div><div style="margin-top:8px"><select id="meSelect">' + meOpts + '</select></div></div>' +
      '<div class="card"><h3>資料儲存（Firebase 同步）</h3><div class="muted">資料存在你的Firebase，拿到這個網址的家人打開都會看到同一份，不用註冊或登入。斷線時會先存在手機，連上網路後自動補上傳。匯出備份可以另外留一份在自己手上。</div>' +
      '<div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn ghost small" data-export>匯出備份</button><button class="btn ghost small" data-import>匯入備份</button><button class="btn danger small" data-clear>清除全部資料</button></div>' +
      (state.localInfo ? '<div class="muted" style="margin-top:12px">這支手機還有以前只存在手機的資料（' + state.localInfo.members + ' 位旅伴、' + state.localInfo.expenses + ' 筆帳目）。</div><div style="margin-top:8px"><button class="btn small" data-mig-upload>上傳到Firebase</button></div>' : '') + '</div>' +
      '<div class="card"><h3>預設匯率</h3><div class="muted">1 日圓 = ? 台幣。記日圓帳目時會自動帶入。每一筆記下後匯率就鎖定，之後再改預設匯率，不會影響已經記的帳。</div>' +
      '<div class="row" style="margin-top:8px"><input type="number" id="rateInput" step="0.0001" min="0" inputmode="decimal" placeholder="例如 0.2" value="' + (state.rate || '') + '"></div></div>';
  }

  // ------------------------------------------------------------------ render
  function viewHasFocusedInput() {
    var a = root.activeElement;
    return !!(a && (a.tagName === 'INPUT' || a.tagName === 'SELECT') && $('view').contains(a));
  }
  function renderBanner() {
    var el = $('banner'), html = '';
    if (state.storageMessage) html += '<div>' + esc(state.storageMessage) + '</div>';
    var li = state.localInfo;
    if (li && !state.loading && lsGet('expenses.migrateSkip') !== '1') {
      html += '<div>這支手機還有以前「只存在手機」的記帳資料（' + li.members + ' 位旅伴、' + li.expenses + ' 筆帳目）。要上傳到Firebase，讓家人也看得到嗎？' +
        '<div class="mig"><button class="btn small" data-mig-upload>上傳到Firebase</button><button class="btn ghost small" data-mig-skip>先不要</button></div></div>';
    }
    el.innerHTML = html;
  }
  function renderModeTag() {
    var el = $('modeTag'); if (!el) return;
    var T = { loading: '連線中…', synced: '已同步', pending: '同步中…', offline: '離線（暫存）' };
    el.textContent = T[state.sync] || T.loading;
  }
  function uploadLocalData(btn) {
    if (btn) { btn.disabled = true; btn.textContent = '上傳中…'; }
    Store.migrateLocal().then(function (counts) {
      state.localInfo = Store.localInfo(); renderBanner(); renderView(true);
      if (counts) toast('已上傳 ' + counts.members + ' 位旅伴、' + counts.expenses + ' 筆帳目到Firebase');
      else if (btn) { btn.disabled = false; btn.textContent = '上傳到Firebase'; }
    });
  }
  function renderTabs() {
    var T = [['list', '明細'], ['settle', '結算'], ['tax', '退稅'], ['settings', '設定']];
    $('tabs').innerHTML = T.map(function (t) {
      return '<button data-tab="' + t[0] + '" class="' + (state.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>';
    }).join('');
  }
  function renderView(force) {
    if (!force && viewHasFocusedInput()) { renderPending = true; return; }
    renderPending = false;
    var html = state.loading ? '<div class="card"><div class="muted">正在讀取資料…</div></div>'
      : state.tab === 'settle' ? viewSettle() : state.tab === 'tax' ? viewTax() : state.tab === 'settings' ? viewSettings() : viewList();

  }
  function renderAll() { renderBanner(); renderModeTag(); renderTabs(); renderView(); }

  // ------------------------------------------------------------------ data actions
  function addMember(name) {
    name = String(name || '').trim(); if (!name) return false;
    if (state.members.some(function (m) { return m.name === name; })) { toast('已經有「' + name + '」了'); return false; }
    Store.addMember(name); return true;
  }
  function memberInUse(id) {
    return state.expenses.some(function (e) { return e.payerId === id || (e.participantIds || []).indexOf(id) > -1; });
  }
  function deleteMember(id) {
    if (memberInUse(id)) { toast('已有帳目用到「' + memberName(id) + '」，無法刪除（可以改名）'); return; }
    confirmBox('確定要刪除旅伴「' + memberName(id) + '」嗎？', '刪除', function () { Store.deleteMember(id); });
  }
  function renameMember(id) {
    askText('旅伴名稱', memberName(id), function (v) { Store.updateMember(id, { name: v }); });
  }
  function saveRate(v) {
    var r = parseFloat(v);
    if (!(r > 0)) return;
    Store.saveSettings({ rate: r });
  }

  function copyText(text, ta) {
    function legacy() { try { ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); return !!document.execCommand('copy'); } catch (e) { return false; } }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacy(); });
    }
    return Promise.resolve(legacy());
  }
  function canDownload() { return !!(window.Blob && window.URL && window.URL.createObjectURL); }
  function downloadText(name, text) {
    var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }
  function openExport() {
    var json = Store.exportJson();
    openDialog('<p><b>匯出備份</b></p><textarea id="bkText" readonly rows="7">' + esc(json) + '</textarea>' +
      '<div class="hint">複製後貼到備忘錄，或傳給自己保存。之後可以用「匯入備份」還原。</div>' +
      '<div class="row" style="margin-top:12px"><button class="btn ghost" style="flex:1" data-close>關閉</button><button class="btn" style="flex:1" data-copy>複製</button></div>' +
      (canDownload() ? '<button class="btn ghost" style="width:100%;margin-top:8px" data-download>下載成檔案</button>' : ''),
      function (w, close) {
        var ta = w.querySelector('#bkText');
        w.querySelector('[data-close]').addEventListener('click', close);
        w.querySelector('[data-copy]').addEventListener('click', function () {
          copyText(json, ta).then(function (ok) { toast(ok ? '已複製' : '請長按文字框，自己選取並複製'); });
        });
        var dl = w.querySelector('[data-download]');
        if (dl) dl.addEventListener('click', function () {
          var d = new Date(); var pad = function (n) { return (n < 10 ? '0' : '') + n; };
          downloadText('trip-expenses-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.json', json);
        });
      });
  }
  function openImport() {
    openDialog('<p><b>匯入備份</b></p><textarea id="impText" rows="7" placeholder="把備份內容貼在這裡"></textarea>' +
      '<div class="hint">匯入會<b>取代</b>目前這支手機上的所有資料。</div><div class="derr" id="impErr"></div>' +
      '<div class="row" style="margin-top:8px"><button class="btn ghost" style="flex:1" data-close>取消</button><button class="btn" style="flex:1" data-go>匯入</button></div>',
      function (w, close) {
        w.querySelector('[data-close]').addEventListener('click', close);
        w.querySelector('[data-go]').addEventListener('click', function () {
          var text = w.querySelector('#impText').value;
          var err = w.querySelector('#impErr');
          if (!text.trim()) { err.textContent = '請先貼上備份內容'; return; }
          var pre = Store.previewImport(text);
          if (!pre.ok) { err.textContent = pre.error; return; }
          err.textContent = '';

            var res = Store.importJson(text);

            close();

          }

          } else { doImport(); }
        });
      });
  }
  function clearAllData() {
    confirmBox('這會刪除 Firebase 上所有的旅伴、日期和帳目，所有人的手機都會一起清空，無法復原。確定要清除嗎？（建議先匯出備份）', '全部清除', function () { Store.clearAll().then(function (ok) { if (ok) toast('已清除'); }); });

  // ------------------------------------------------------------------ expense form
  function defaultDay(preset) {
    if (preset && state.days.indexOf(preset) > -1) return preset;
    var t = todayStr();
    return state.days.indexOf(t) > -1 ? t : state.days[state.days.length - 1];
  }
  function newFormState(presetDate) {
    var me = lsGet('expenses.me');
    var payer = state.members.some(function (m) { return m.id === me; }) ? me : state.members[0].id;
    return { date: defaultDay(presetDate), title: '', category: '餐飲', currency: 'JPY', amount: '', rate: state.rate ? String(state.rate) : '',
      payerId: payer, participantIds: state.members.map(function (m) { return m.id; }), taxFree: false, store: '', taxRate: 10, consumed: false };
  }
  function formFromExpense(e) {
    return { date: e.date, title: e.title, category: e.category, currency: e.currency, amount: String(e.amount),
      rate: e.currency === 'JPY' ? String(e.rate) : (state.rate ? String(state.rate) : ''),
      payerId: e.payerId, participantIds: (e.participantIds || []).slice(), taxFree: !!e.taxFree, store: e.store || '',
      taxRate: Number(e.taxRate) || 10, consumed: !!e.consumed };
  }
  function formHtml(f, isEdit) {
    var chips = state.members.map(function (m) {
      return '<button type="button" class="chip' + (f.participantIds.indexOf(m.id) > -1 ? ' on' : '') + '" data-part="' + m.id + '">' + esc(m.name) + '</button>';
    }).join('');
    var payer = state.members.map(function (m) { return '<option value="' + m.id + '"' + (m.id === f.payerId ? ' selected' : '') + '>' + esc(m.name) + '</option>'; }).join('');
    var dayOpts = state.days.slice().reverse().map(function (d) { return '<option value="' + d + '"' + (d === f.date ? ' selected' : '') + '>' + esc(fmtDate(d)) + '</option>'; }).join('');
    if (f.date && state.days.indexOf(f.date) === -1) dayOpts = '<option value="' + esc(f.date) + '" selected>' + esc(fmtDate(f.date)) + '</option>' + dayOpts;
    var cats = CATEGORIES.map(function (c) { return '<option' + (c.label === f.category ? ' selected' : '') + '>' + c.label + '</option>'; }).join('');
    return '<div class="sheet"><div class="sheet-top"><button class="btn ghost small" data-f="cancel">取消</button><b>' + (isEdit ? '編輯帳目' : '記一筆') + '</b><button class="btn small" data-f="save">儲存</button></div><div class="sheet-body">' +
      '<label class="f" for="f_date">日期（從已新增的天數選）</label><select id="f_date">' + dayOpts + '</select><div class="hint tight">沒有想要的日期？先取消，按右下角「＋ 新的一天」新增。</div>' +
      '<label class="f" for="f_title">品項</label><input type="text" id="f_title" placeholder="例如：拉麵、Suica儲值" value="' + esc(f.title) + '">' +
      '<label class="f" for="f_category">分類</label><select id="f_category">' + cats + '</select>' +
      '<label class="f">幣別</label><div class="seg"><button type="button" data-cur="JPY" class="' + (f.currency === 'JPY' ? 'on' : '') + '">日圓 ¥</button><button type="button" data-cur="TWD" class="' + (f.currency === 'TWD' ? 'on' : '') + '">台幣 NT$</button></div>' +
      '<label class="f" for="f_amount">金額（含稅、實際付的）</label><input type="number" id="f_amount" inputmode="decimal" min="0" step="any" placeholder="0" value="' + esc(f.amount) + '">' +
      '<div id="f_rateWrap"><label class="f" for="f_rate">匯率：1 日圓 = ? 台幣</label><input type="number" id="f_rate" inputmode="decimal" min="0" step="any" placeholder="例如 0.2" value="' + esc(f.rate) + '"><div class="hint" id="f_twdPreview"></div></div>' +
      '<label class="f" for="f_payer">誰付的</label><select id="f_payer">' + payer + '</select>' +
      '<label class="f">誰要分攤（平均分）</label><div>' + chips + '<button type="button" class="chip" data-allparts="1">全選</button></div><div class="hint" id="f_shares"></div>' +
      '<div id="f_taxWrap" class="box"><label class="check" style="margin-top:0"><input type="checkbox" id="f_taxfree"' + (f.taxFree ? ' checked' : '') + '><span>在免稅店購買，打算辦退稅</span></label>' +
      '<div id="f_taxFields"><label class="f" for="f_store">店名（同一家店請寫一樣）</label><input type="text" id="f_store" placeholder="例如：Bic Camera 池袋" value="' + esc(f.store) + '"><div class="hist" id="f_storeHist"></div>' +
      '<label class="f">稅率</label><div class="seg"><button type="button" data-taxrate="10" class="' + (f.taxRate === 10 ? 'on' : '') + '">10%（一般商品）</button><button type="button" data-taxrate="8" class="' + (f.taxRate === 8 ? 'on' : '') + '">8%（食品飲料）</button></div>' +
      '<label class="check"><input type="checkbox" id="f_consumed"' + (f.consumed ? ' checked' : '') + '><span>已經吃掉或用掉（不能退稅）</span></label><div class="hint" id="f_taxPreview"></div></div></div>' +
      '<div class="err" id="fError"></div>' +
      (isEdit ? '<button class="btn danger" style="width:100%;margin-top:14px" data-f="delete">刪除這筆帳目</button>' : '') +
      '</div></div>';
  }
  function applyFormVisibility() {
    var f = formState;
    var jpy = f.currency === 'JPY';
    var canTax = jpy && isGoods(f.category);
    var q = function (id) { return $(id); };
    q('f_rateWrap').style.display = jpy ? '' : 'none';
    q('f_taxWrap').style.display = canTax ? '' : 'none';
    q('f_taxFields').style.display = (canTax && f.taxFree) ? '' : 'none';
    Array.prototype.forEach.call(root.querySelectorAll('[data-cur]'), function (b) { b.className = b.getAttribute('data-cur') === f.currency ? 'on' : ''; });
    Array.prototype.forEach.call(root.querySelectorAll('[data-taxrate]'), function (b) { b.className = Number(b.getAttribute('data-taxrate')) === f.taxRate ? 'on' : ''; });
    Array.prototype.forEach.call(root.querySelectorAll('[data-part]'), function (b) { b.className = 'chip' + (f.participantIds.indexOf(b.getAttribute('data-part')) > -1 ? ' on' : ''); });
    updateFormPreview();
  }
  // Store names typed before (newest first, one per store), so a later purchase can just tap one.
  // Same spelling = same store, which is what makes the 5,000-yen threshold add up.
  function storeHistory() {
    var seen = {}, out = [];
    state.expenses.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    }).forEach(function (e) {
      var n = String(e.store || '').trim(), k = n.toLowerCase();
      if (n && !seen[k]) { seen[k] = 1; out.push(n); }
    });
    return out;
  }
  function renderStoreHistory() {
    var el = $('f_storeHist');
    if (!el || !formState) return;
    var typed = String(formState.store || '').trim().toLowerCase();
    var list = storeHistory().filter(function (n) { return !typed || n.toLowerCase().indexOf(typed) > -1; }).slice(0, 10);
    el.innerHTML = list.length
      ? '<div class="lab">以前填過的店名，點一下就填入</div>' + list.map(function (n) {
          return '<button type="button" class="chip sm' + (n.toLowerCase() === typed ? ' on' : '') + '" data-store="' + esc(n) + '">' + esc(n) + '</button>';
        }).join('')
      : '';
  }
  function updateFormPreview() {
    var f = formState, q = function (id) { return $(id); };
    var amt = parseFloat(f.amount), rate = parseFloat(f.rate);
    var jpy = f.currency === 'JPY';
    q('f_twdPreview').textContent = (jpy && amt > 0 && rate > 0) ? '≈ ' + fmtTwd(amt * rate) : '';
    var shareEl = q('f_shares');
    if (amt > 0 && f.participantIds.length) {
      var ordered = state.members.filter(function (m) { return f.participantIds.indexOf(m.id) > -1; });
      var sh = splitMinor(minorOf(amt, f.currency), ordered.map(function (m) { return m.id; }));
      shareEl.textContent = ordered.map(function (m) { return m.name + ' ' + (jpy ? fmtYen(sh[m.id]) : fmtTwd(sh[m.id] / 100)); }).join('　');
    } else { shareEl.textContent = ''; }
    var tp = q('f_taxPreview');
    if (jpy && f.taxFree && amt > 0) {
      var t = taxInfo({ taxFree: true, currency: 'JPY', amount: Math.round(amt), taxRate: f.taxRate });
      tp.textContent = '未稅 ' + fmtYen(t.pretax) + '，稅金 ' + fmtYen(t.tax) + '（同店同日未稅滿 ' + fmtYen(TAX_THRESHOLD) + ' 才能退）';
    } else { tp.textContent = ''; }
    renderStoreHistory();
  }
  function openForm(exp, presetDate) {
    if (state.loading) { toast('資料還在讀取中，請稍候'); return; }
    if (!state.members.length) { state.tab = 'settings'; renderAll(); toast('請先新增旅伴'); return; }
    if (!state.days.length) { toast('先新增一天，才能記帳'); openNewDay(); return; }
    formState = exp ? formFromExpense(exp) : newFormState(presetDate);
    formId = exp ? exp.id : null;
    var layer = $('sheetLayer');
    layer.innerHTML = formHtml(formState, !!exp);
    applyFormVisibility();
    var sheet = layer.querySelector('.sheet');
    sheet.addEventListener('input', function (e) {
      var id = e.target.id, f = formState;
      if (id === 'f_amount') f.amount = e.target.value;
      else if (id === 'f_rate') f.rate = e.target.value;
      else if (id === 'f_title') f.title = e.target.value;
      else if (id === 'f_store') f.store = e.target.value;
      else if (id === 'f_date') f.date = e.target.value;
      else return;
      updateFormPreview();
    });
    sheet.addEventListener('change', function (e) {
      var id = e.target.id, f = formState;
      if (id === 'f_category') f.category = e.target.value;
      else if (id === 'f_payer') f.payerId = e.target.value;
      else if (id === 'f_taxfree') f.taxFree = e.target.checked;
      else if (id === 'f_consumed') f.consumed = e.target.checked;
      else if (id === 'f_date') f.date = e.target.value;
      else return;
      applyFormVisibility();
    });
    sheet.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('button') : null; if (!t) return;
      var f = formState;
      if (t.hasAttribute('data-cur')) { f.currency = t.getAttribute('data-cur'); applyFormVisibility(); }
      else if (t.hasAttribute('data-store')) {
        f.store = t.getAttribute('data-store');
        var si = $('f_store'); si.value = f.store; si.blur();
        updateFormPreview();
      }
      else if (t.hasAttribute('data-taxrate')) { f.taxRate = Number(t.getAttribute('data-taxrate')); applyFormVisibility(); }
      else if (t.hasAttribute('data-part')) {
        var id = t.getAttribute('data-part'), i = f.participantIds.indexOf(id);
        if (i > -1) f.participantIds.splice(i, 1); else f.participantIds.push(id);
        applyFormVisibility();
      }
      else if (t.hasAttribute('data-allparts')) { f.participantIds = state.members.map(function (m) { return m.id; }); applyFormVisibility(); }
      else if (t.getAttribute('data-f') === 'cancel') closeForm();
      else if (t.getAttribute('data-f') === 'save') saveForm();
      else if (t.getAttribute('data-f') === 'delete') {
        confirmBox('確定要刪除這筆帳目嗎？', '刪除', function () {
          Store.deleteExpense(formId);
          closeForm();
        });
      }
    });
    if (!exp) setTimeout(function () { var a = $('f_amount'); if (a) a.focus(); }, 60);
  }
  function closeForm() {
    $('sheetLayer').innerHTML = '';
    formState = null; formId = null;
    syncBodyScroll();
    if (renderPending) renderView();
  }
  function setFormError(msg) { var el = $('fError'); if (el) el.textContent = msg || ''; }
  function saveForm() {
    var f = formState; if (!f) return;
    var amount = parseFloat(f.amount), rate = parseFloat(f.rate);
    if (!(amount > 0)) { setFormError('請輸入金額'); return; }
    if (!f.date) { setFormError('請選日期'); return; }
    var jpy = f.currency === 'JPY';
    if (jpy) { amount = Math.round(amount); if (!(rate > 0)) { setFormError('請輸入匯率（1 日圓 = ? 台幣）'); return; } }
    else { amount = Math.round(amount * 100) / 100; rate = 1; }
    if (!f.payerId) { setFormError('請選擇誰付的'); return; }
    if (!f.participantIds.length) { setFormError('請至少選一位分攤的人'); return; }
    var canTax = jpy && isGoods(f.category);
    var taxFree = canTax && f.taxFree;
    if (taxFree && !String(f.store).trim()) { setFormError('請填店名，同一家店同一天才會合併計算門檻'); return; }
    var ordered = state.members.filter(function (m) { return f.participantIds.indexOf(m.id) > -1; }).map(function (m) { return m.id; });
    var existing = null;
    if (formId) state.expenses.forEach(function (e) { if (e.id === formId) existing = e; });
    var data = {
      date: f.date, title: String(f.title).trim() || f.category, category: f.category, currency: f.currency,
      amount: amount, rate: rate, payerId: f.payerId, participantIds: ordered,
      taxFree: !!taxFree, store: taxFree ? String(f.store).trim() : '', taxRate: Number(f.taxRate) || 10, consumed: !!(taxFree && f.consumed),
      createdAt: existing && existing.createdAt ? existing.createdAt : Date.now()
    };
    setAccClosed('day:' + data.date, false);
    if (formId) Store.setExpense(formId, data); else Store.addExpense(data);
    if (jpy && state.rate !== rate) Store.saveSettings({ rate: rate });
    closeForm();
  }

  // ------------------------------------------------------------------ side drawer (glossary + refund cheat sheet)
  var GLOSSARY = [
    ['合計／お会計', '總計。記帳要填的是含稅的這個數字'],
    ['小計', '小計，不一定是最後要付的金額'],
    ['税込／税抜', '含稅／未稅'],
    ['内消費税（等）', '內含的消費稅金額'],
    ['8%対象／10%対象', '適用 8%／10% 稅率的金額'],
    ['軽減税率、※', '適用 8% 的減稅稅率商品，常用 ※ 標記'],
    ['免税', '免稅'],
    ['お預り／お釣り', '你給的錢／找零'],
    ['現金／クレジット', '現金／信用卡']
  ];
  function drawerHtml() {
    var rows = GLOSSARY.map(function (g) {
      var term = g[0].split('／').map(function (part) { return '<span class="nw">' + esc(part) + '</span>'; }).join('／<wbr>');
      return '<tr><td class="jp">' + term + '</td><td>' + esc(g[1]) + '</td></tr>';
    }).join('');
    return '<div class="dhead"><b>對照表與退稅小抄</b><button class="dclose" id="drawerClose" aria-label="關閉">✕</button></div>' +
      '<div class="dsec"><h4>收據對照表</h4><table class="gloss">' + rows + '</table>' +
      '<div class="muted" style="margin-top:8px">看不懂時，可以用 iPhone 的「翻譯」App 相機。出發前先下載日文語言包，就能離線使用。金額和稅率請自己再看一眼。</div></div>' +
      '<div class="dsec"><h4>離境當天檢查清單</h4><div class="muted">日本觀光廳規定（2026年11月起適用）</div><ol class="steps">' +
      '<li>到機場後，先找<b>免稅手續機台</b>（出境大廳，在託運行李<b>之前</b>）</li>' +
      '<li>免稅商品和收據都帶在身邊，不要先託運</li>' +
      '<li>掃護照：綠燈＝完成；紅燈＝把商品帶到海關查驗區</li>' +
      '<li>成田也可用 Visit Japan Web，在專用Wi‑Fi區網路辦理（到安檢前）</li>' +
      '<li>已經吃掉或用掉的商品，不要在機台辦理，改向海關櫃台說明</li>' +
      '<li>辦完退稅，再託運行李、報到登機</li></ol></div>' +
      '<div class="dsec"><h4>記帳時的重點</h4><ul class="notes">' +
      '<li>同一家店、同一天，<b>未稅</b>合計滿 ¥5,000 才能退</li>' +
      '<li>整張收據一起算：少一件或吃掉一件，整張都不能退。要吃掉／用掉的和要帶回台灣的，請分開結帳、分開記帳</li>' +
      '<li>只有「商品」能退，餐飲、住宿、交通、門票不行</li>' +
      '<li>店名請每次寫一樣，才會合併計算</li>' +
      '<li>退款方式和手續費依店家而定，結帳時記得問</li></ul></div>';
  }
  var drawerOpen = false;
  function syncBodyScroll() { /* the page behind is locked by the host while this screen is open */ }
  function openDrawer() {
    var d = $('drawer');
    drawerOpen = true; d.scrollTop = 0;
    d.className = 'drawer open'; d.setAttribute('aria-hidden', 'false');
    $('drawerMask').className = 'dmask open';
    syncBodyScroll();
  }
  function closeDrawer() {
    var d = $('drawer');
    drawerOpen = false;
    d.className = 'drawer'; d.setAttribute('aria-hidden', 'true');
    $('drawerMask').className = 'dmask';
    syncBodyScroll();
  }
  function bindDrawer() {
    $('drawer').innerHTML = drawerHtml();
    $('drawerHandle').addEventListener('click', openDrawer);
    $('drawerMask').addEventListener('click', closeDrawer);
    $('drawerClose').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && drawerOpen) closeDrawer(); });
    // swipe: right from the left edge opens, left inside the drawer closes (mostly-horizontal drags only)
    function swipe(el, onSwipe) {
      var sx = null, sy = null;
      el.addEventListener('touchstart', function (e) { var t = e.touches && e.touches[0]; if (t) { sx = t.clientX; sy = t.clientY; } }, { passive: true });
      el.addEventListener('touchend', function (e) {
        var t = e.changedTouches && e.changedTouches[0];
        if (sx !== null && t) { var dx = t.clientX - sx, dy = t.clientY - sy; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) onSwipe(dx); }
        sx = null; sy = null;
      }, { passive: true });
    }
    swipe($('edgeStrip'), function (dx) { if (dx > 0) openDrawer(); });
    swipe($('drawer'), function (dx) { if (dx < 0) closeDrawer(); });
  }

  // ------------------------------------------------------------------ events
  function bindStatic() {
    $('fab').addEventListener('click', function () { openForm(null); });
    $('fabDay').addEventListener('click', openNewDay);
    $('banner').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null; if (!b) return;
      if (b.hasAttribute('data-mig-upload')) uploadLocalData(b);
      else if (b.hasAttribute('data-mig-skip')) { lsSet('expenses.migrateSkip', '1'); renderBanner(); }
    });
    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-tab]') : null; if (!b) return;
      state.tab = b.getAttribute('data-tab'); renderTabs(); renderView(true); $('scroll').scrollTop = 0;
    });
    var view = $('view');
    view.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('button') : null; if (!t) return;
      if (t.hasAttribute('data-acc-toggle')) toggleAcc(t.closest('.acc'));
      else if (t.hasAttribute('data-day-add')) openForm(null, t.getAttribute('data-day-add'));
      else if (t.hasAttribute('data-day-menu')) openDayMenu(t.getAttribute('data-day-menu'));
      else if (t.hasAttribute('data-edit')) {
        var id = t.getAttribute('data-edit'), found = null;
        state.expenses.forEach(function (x) { if (x.id === id) found = x; });
        if (found) openForm(found);
      }
      else if (t.hasAttribute('data-add-member')) {
        var inp = $('newMember');
        var v = inp ? inp.value : '';
        if (addMember(v) && inp) inp.value = '';
        renderView(true);
        var again = $('newMember'); if (again && !v.trim()) again.focus();
      }
      else if (t.hasAttribute('data-open-drawer')) openDrawer();
      else if (t.hasAttribute('data-mig-upload')) uploadLocalData(t);
      else if (t.hasAttribute('data-export')) openExport();
      else if (t.hasAttribute('data-import')) openImport();
      else if (t.hasAttribute('data-clear')) clearAllData();
      else if (t.hasAttribute('data-del-member')) deleteMember(t.getAttribute('data-del-member'));
      else if (t.hasAttribute('data-rename')) renameMember(t.getAttribute('data-rename'));
    });
    view.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.id === 'newMember') {
        var v = e.target.value;
        if (addMember(v)) e.target.value = '';
        renderView(true);
        var again = $('newMember'); if (again) again.focus();
      }
    });
    view.addEventListener('change', function (e) {
      if (e.target.id === 'rateInput') saveRate(e.target.value);
      if (e.target.id === 'meSelect') lsSet('expenses.me', e.target.value);
    });
    view.addEventListener('focusout', function () {
      setTimeout(function () { if (renderPending && !viewHasFocusedInput()) renderView(); }, 250);
    });
  }

  // ------------------------------------------------------------------ boot (called once, with the shadow root)
  function mount(shadowRoot) {
    root = shadowRoot;
    if (lsGet('expenses.howto') === 'closed') { setAccClosed('howto', true); try { window.localStorage.removeItem('expenses.howto'); } catch (e) { /* ignore */ } }   // older versions
    bindStatic();
    bindDrawer();
    Store.start({
      onMembers: function (list) { state.members = list.sort(function (a, b) { return (a.order || 0) - (b.order || 0); }); renderAll(); },
      onExpenses: function (list) { state.expenses = list; renderView(); },
      onDays: function (list) { state.days = list.map(function (d) { return d.date; }).sort(); renderView(); },
      onSettings: function (st) { state.rate = st && st.rate > 0 ? Number(st.rate) : null; renderView(); },
      onStatus: function (st) {
        if (st.message !== undefined) state.storageMessage = st.message;
        if (st.sync) { state.sync = st.sync; if (st.sync === 'synced') state.storageMessage = ''; }
        renderBanner(); renderModeTag();
      },
      onReady: function () { state.loading = false; state.localInfo = Store.localInfo(); renderAll(); }
    });
    renderAll();
  }
  window.ExpenseApp = { mount: mount };
})();
</script>
<script>
(function () {
  "use strict";
  // Hosts the expense screen inside this page: an isolated container (shadow DOM) so its styles and ids can never
  // clash with the guide, started at page load so the data is already here when the wallet icon is tapped.
  var host = document.getElementById('expHost');
  var isOpen = false, pushed = false, mounted = false;
  function mountOnce() {
    if (mounted) return; mounted = true;
    try {
      var shadow = host.attachShadow({ mode: 'open' });
      shadow.appendChild(document.getElementById('expTemplate').content.cloneNode(true));
      window.ExpenseApp.mount(shadow);
      shadow.getElementById('expBack').addEventListener('click', close);
    } catch (e) { console.error('expense screen failed to start', e); }
  }
  function hide() {
    if (!isOpen) return;
    isOpen = false; host.classList.remove('open'); document.body.style.overflow = '';
  }
  function open() {
    if (isOpen) return;
    isOpen = true; host.classList.add('open'); document.body.style.overflow = 'hidden';
    try { history.pushState({ exp: 1 }, ''); pushed = true; } catch (e) { pushed = false; }   // so the phone's back gesture closes it
  }
  function close() {
    if (pushed) {
      pushed = false;
      try { history.back(); setTimeout(hide, 350); return; } catch (e) { /* fall through */ }
    }
    hide();
  }
  window.addEventListener('popstate', function () { pushed = false; hide(); });
  window.ExpenseHost = { open: open, close: close, isOpen: function () { return isOpen; } };
  mountOnce();
})();
</script>
</body>
</html>
