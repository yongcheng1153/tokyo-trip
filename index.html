<style>
  :root {
    color-scheme: light;
    --bg: #FBF1E4; --card: #FFFFFF; --text: #4A3626; --muted: #9C8770;
    --tan: #B9713F; --tan-deep: #8B5E34; --line: #EADFCB;
    --accent: #E8A085; --amber: #A65C1E; --amberbg: #FDF0E4; --amberline: #F0C9A0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    color: var(--text); overflow-x: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  a { color: var(--tan); text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: #C97B4A; cursor: pointer; flex-shrink: 0; }
  input[type="text"] { font-family: inherit; background: #FFFFFF; color: #4A3626; -webkit-text-fill-color: #4A3626; }
  .fredoka { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 700; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 14px 12px 40px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: 0 4px 14px rgba(139,94,52,0.1); }
  .card h3 { margin: 0; font-size: 14px; color: #5A3A1E; }
  .card-head { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
  .btn-icon { width: 34px; height: 34px; border-radius: 50%; background: #fff; border: none; box-shadow: 0 3px 8px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; }
  .pill { border-radius: 999px; padding: 7px 12px; font-size: 11.5px; font-weight: 700; border: none; white-space: nowrap; }
  .tag { background: #FBEADA; color: var(--tan); font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px; }
  .modal-mask { position: fixed; inset: 0; background: rgba(74,54,38,0.45); z-index: 60; }
  .modal-box { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 86%; max-width: 380px; max-height: 78vh; overflow-y: auto; background: #fff; border-radius: 18px; z-index: 61; padding: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
  .modal-box-top { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 86%; max-width: 300px; height: auto; background: #fff; border-radius: 14px; z-index: 71; padding: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .close-x { background: #FBF1E4; border: none; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .drawer { position: fixed; top: 0; left: 0; height: 100vh; width: 50%; min-width: 220px; max-width: 300px; background: #fff; z-index: 51; transition: transform 0.25s ease; overflow-y: auto; box-shadow: 6px 0 24px rgba(0,0,0,0.18); padding: 16px 10px 30px; transform: translateX(-100%); }
  .drawer.open { transform: translateX(0); }
  .edge-strip { position: fixed; left: 0; top: 0; width: 24px; height: 100vh; z-index: 44; background: transparent; }
  .handle { position: fixed; left: 0; top: 50%; transform: translateY(-50%); background: var(--tan-deep); color: #fff; border: none; padding: 14px 7px; border-radius: 0 14px 14px 0; box-shadow: 3px 3px 10px rgba(0,0,0,0.15); z-index: 45; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .toolbar { position: fixed; top: 14px; right: 12px; z-index: 46; display: flex; flex-direction: column; gap: 8px; }
  .place-row, .booking-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: #FBF1E4; border-radius: 11px; padding: 10px; }
  .place-row.dragging { opacity: 0.6; box-shadow: 0 6px 16px rgba(0,0,0,0.2); }
  .drag-handle { flex-shrink: 0; padding: 12px 8px; margin: -8px -4px; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  .place-row { position: relative; }
  .item-acc-head { display: flex; gap: 9px; align-items: flex-start; flex: 1; min-width: 0; width: 100%; text-align: left; background: none; border: none; padding: 0; font-family: inherit; cursor: pointer; }
  .item-acc .chev { display: inline-block; transition: transform 0.2s ease; flex-shrink: 0; margin-top: 3px; }
  .item-acc:not(.open) .chev { transform: rotate(-90deg); }
  .food-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 9px; }
  #expHost { position: fixed; inset: 0; z-index: 90; visibility: hidden; opacity: 0; pointer-events: none; transition: opacity 0.18s ease, visibility 0s linear 0.18s; }
  #expHost.open { visibility: visible; opacity: 1; pointer-events: auto; transition: opacity 0.18s ease; }
</style>

<style>

  :host { color-scheme: light; --bg:#FBF1E4; --card:#FFFFFF; --text:#4A3626; --muted:#9C8770; --accent:#B9713F; --dark:#8B5E34; --line:#EADFCB; --soft:#FBEADA; --danger:#B84343; --ok:#4E8B5E; }
  * { box-sizing: border-box; }
  .root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; -webkit-text-size-adjust: 100%; }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; font-size: 16px; color: var(--text); background: #FFFFFF; }
  a { color: var(--accent); text-decoration: none; }
  .top { background: linear-gradient(135deg, #E8B98C 0%, #D9986A 100%); padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 16px; flex: none; }
  .top .back { border: none; font-family: inherit; cursor: pointer; display: inline-block; font-size: 12px; color: #6B4425; background: rgba(255,255,255,0.8); border-radius: 999px; padding: 4px 10px; margin-bottom: 8px; }
  .top .toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .top h1 { margin: 0 0 2px; font-size: 22px; color: #5A3A1E; }
  .top .mode { font-size: 11px; font-weight: 700; color: #6B4425; background: rgba(255,255,255,0.8); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .top p { margin: 0; font-size: 12px; color: #6B4425; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 12px 12px 210px; }

  .banner > div { background: #FDF0E4; border: 1.5px solid #F0C9A0; border-radius: 12px; padding: 10px 12px; font-size: 12px; color: #A65C1E; line-height: 1.6; }
  .card { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: 0 4px 14px rgba(139,94,52,0.10); }
  .card h3 { margin: 0 0 8px; font-size: 15px; color: #5A3A1E; }
  .muted { color: var(--muted); font-size: 12px; line-height: 1.6; }
  .big { font-size: 26px; font-weight: 700; color: var(--dark); }
  .empty { text-align: center; color: #B49A7F; font-size: 13px; padding: 26px 10px; }
  .dayhead { font-size: 12px; font-weight: 700; color: var(--accent); margin: 14px 4px 6px; }
  .exp { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: var(--card); border: none; border-radius: 14px; padding: 11px 13px; margin-bottom: 7px; box-shadow: 0 3px 10px rgba(139,94,52,0.08); color: var(--text); }
  .exp .l { min-width: 0; }
  .exp .t { font-size: 14px; font-weight: 700; }
  .exp .m { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .exp .n { flex: 1 1 0; min-width: 0; font-size: 12px; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .exp .r { text-align: right; flex-shrink: 0; }
  .exp .a { font-size: 14px; font-weight: 700; color: var(--dark); }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: var(--soft); color: var(--accent); margin-left: 4px; }
  .tag.gray { background: #EEE7DC; color: #8A7B68; }

  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  function exportData() {
    var out = [];
    orderedDays().forEach(function (day) {
      var info = dayInfo(day), p = info.date.split('-');
      var wd = WEEK[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
      var items = dayItems(day).map(function (e) {
        var spots = state.foodSpots.filter(function (f) { return f && f.itemId === e.itemId && f.label; }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); })
          .map(function (f) { return { label: f.label, url: /^https?:\/\//i.test(String(f.url || '')) ? f.url : '', desc: f.desc || '' }; });
        return { time: e.it.time, name: e.it.name, desc: e.it.desc || '', spots: spots };
      });
      var list = state.checklist.filter(function (c) { return c && c.dayId === day.id && String(c.label || '').trim(); })
        .sort(function (a, b) { return (a.order || 0) - (b.order || 0); }).map(function (c) { return { label: String(c.label).trim(), checked: !!c.checked }; });
      out.push({ head: (+p[1]) + '/' + (+p[2]) + '（' + wd + '）' + dayTitle(day), items: items, list: list });
    });
    return out;
  }
  function buildExportText() {

  function copyText(text) {
    function fallback() {
      try { var ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;'; document.body.appendChild(ta); ta.select(); var ok = document.execCommand('copy'); document.body.removeChild(ta); return ok; } catch (e) { return false; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
    return Promise.resolve(fallback());
  }

  // ---------------------------------------------------------------------
  // Swipe handling for the drawer
  // ---------------------------------------------------------------------
  function bindSwipeOpen(el) {
    var startX = null;
    el.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
    el.addEventListener('touchend', function (e) {
      if (startX === null) return;
      var endX = e.changedTouches[0].clientX;
      if (endX - startX > 45) { state.drawerOpen = true; render(); }
      startX = null;
    }, { passive: true });
  }
  function bindSwipeClose(el) {
    var startX = null;
    el.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
    el.addEventListener('touchend', function (e) {
      if (startX === null) return;
      var endX = e.changedTouches[0].clientX;
      if (startX - endX > 45) { state.drawerOpen = false; render(); }
      startX = null;
    }, { passive: true });
  }

  // ---------------------------------------------------------------------
  // Drag-to-reorder for places (touch-based)
  // ---------------------------------------------------------------------
  var dragActive = false;      // while true, render() is deferred so the dragged row is never destroyed
  var renderPending = false;

  function bindDragHandle(handleEl) {
    var placeId = handleEl.getAttribute('data-drag-handle');
    handleEl.addEventListener('pointerdown', function (e) {
      if (e.button != null && e.button !== 0 && e.pointerType === 'mouse') return;
      var list = document.getElementById('placesList');
      if (!list) return;
      e.preventDefault();

      var rows = Array.prototype.slice.call(list.querySelectorAll('.place-row'));
      var startIdx = -1;
      rows.forEach(function (r, i) { if (r.getAttribute('data-place-id') === placeId) startIdx = i; });
      if (startIdx < 0) return;

      // Measure everything once, before anything moves
      var rects = rows.map(function (r) { var b = r.getBoundingClientRect(); return { top: b.top, height: b.height }; });
      var gap = 7;
      var startY = e.clientY;
      var dragRow = rows[startIdx];
      var dragH = rects[startIdx].height + gap;
      var targetIdx = startIdx;

      dragActive = true;
      dragRow.classList.add('dragging');
      dragRow.style.zIndex = '5';
      dragRow.style.transition = 'none';
      rows.forEach(function (r, i) { if (i !== startIdx) r.style.transition = 'transform 0.15s ease'; });
      try { if (handleEl.setPointerCapture && e.pointerId != null) handleEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }

      function onMove(ev) {
        var dy = ev.clientY - startY;
        // keep the dragged row inside the list
        var minDy = rects[0].top - rects[startIdx].top;
        var maxDy = (rects[rects.length - 1].top + rects[rects.length - 1].height) - (rects[startIdx].top + rects[startIdx].height);
        dy = Math.max(minDy, Math.min(maxDy, dy));
        dragRow.style.transform = 'translateY(' + dy + 'px)';

        // Use the dragged row's leading edge (bottom when moving down, top when moving up),
        // so dragging all the way to either end always passes the last/first row.
        var edgeTop = rects[startIdx].top + dy;
        var edgeBottom = edgeTop + rects[startIdx].height;
        var t = startIdx;
        rows.forEach(function (r, i) {
          if (i === startIdx) return;
          var mid = rects[i].top + rects[i].height / 2;
          var shift = 0;
          if (i > startIdx && edgeBottom > mid) { shift = -dragH; t = Math.max(t, i); }
          else if (i < startIdx && edgeTop < mid) { shift = dragH; t = Math.min(t, i); }
          r.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
        });
        targetIdx = t;
      }

      function finish(commit) {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onCancel);
        try { if (handleEl.releasePointerCapture && e.pointerId != null) handleEl.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        dragActive = false;
        if (commit && targetIdx !== startIdx) {
          var ids = rows.map(function (r) { return r.getAttribute('data-place-id'); });
          var moved = ids.splice(startIdx, 1)[0];
          ids.splice(targetIdx, 0, moved);
          commitPlacesOrder(ids);   // re-renders
        } else {
          renderPending = false;
          render();
        }
      }
      function onUp() { finish(true); }
      function onCancel() { finish(false); }

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onCancel);
    });
  }

  // ---------------------------------------------------------------------
  // DB-backed actions
  // ---------------------------------------------------------------------
  function addPlace(name, url, note) {
    if (!db) { state.addPlaceError = '目前連不上資料庫，請檢查網路連線'; render(); return; }
    var dayPlaces = state.places.filter(function (p) { return p.dayId === state.activeDayId; });
    var maxOrder = dayPlaces.reduce(function (m, p) { return Math.max(m, p.order); }, -1);
    db.collection('places').add({ dayId: state.activeDayId, name: name, url: url || '', note: note || '', order: maxOrder + 1 })
      .then(function () {
        state.addPlaceOpen = false;
        state.addPlaceError = '';
        render();
      })
      .catch(function (err) {
        noteDbError('addPlace 失敗', err);
        state.addPlaceError = '新增失敗（' + (err && err.code ? err.code : '未知錯誤') + '），請確認Firestore規則允許寫入';
        render();
      });
  }
  // Accepts only real web addresses; adds https:// when it is missing. Returns '' when it is not a usable address.
  function normalizeUrl(raw) {
    var u = String(raw || '').trim();
    if (!u || /\s/.test(u)) return '';
    if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
    if (!/^https?:\/\/[^\/?#.]+\.[^\/?#]+|^https?:\/\/localhost\b/i.test(u)) return '';
    return u;
  }
  function addLink(label, url, desc) {
    if (!db) { state.addLinkError = '目前連不上資料庫，請檢查網路連線'; render(); return; }
    var maxOrder = state.links.reduce(function (m, l) { return Math.max(m, l.order || 0); }, -1);
    db.collection('links').add({ label: label, url: url, desc: desc || '', order: maxOrder + 1, createdAt: Date.now() })
      .then(function () { state.addLinkOpen = false; state.addLinkError = ''; render(); })
      .catch(function (err) {
        noteDbError('addLink 失敗', err);
        state.addLinkError = '新增失敗（' + (err && err.code ? err.code : '未知錯誤') + '），請確認Firestore規則允許寫入';
        render();

    function attach() {

      addMember: function (name) {

      },
      updateMember: function (id, patch) { guard(ref('members/' + id).update(patch), '改名失敗'); },
      deleteMember: function (id) { guard(ref('members/' + id).delete(), '刪除旅伴失敗'); },
      addExpense: function (obj) { var id = newId('e_'), e = cloneJson(obj); delete e.id; guard(ref('expenses/' + id).set(e), '儲存帳目失敗'); return id; },
      setExpense: function (id, obj) { var e = cloneJson(obj); delete e.id; guard(ref('expenses/' + id).set(e), '儲存帳目失敗'); },
      deleteExpense: function (id) { guard(ref('expenses/' + id).delete(), '刪除帳目失敗'); },
      addDay: function (date) {

        guard(ref('days/' + date).set({ date: date }), '新增日期失敗'); return { ok: true };
      },
      // Changing a day's date moves all of its expenses with it (one atomic batch)
      moveDay: function (oldDate, newDate) {
        if (!isDateStr(newDate)) return { ok: false, error: '請選一個日期' };
        if (oldDate === newDate) return { ok: true };
        if (data.days.some(function (d) { return d.date === newDate; })) return { ok: false, error: '這一天已經有了' };
        var b = newBatch();
        b.set(ref('days/' + newDate), { date: newDate });
        b.delete(ref('days/' + oldDate));
        data.expenses.forEach(function (e) { if (e.date === oldDate) b.update(ref('expenses/' + e.id), { date: newDate }); });
        guard(b.commit(), '改日期失敗'); return { ok: true };
      },
      // Deletes the day together with every expense on it (one atomic batch); the screen asks first when there are any

      },
      saveHomePhoto: function (dataUrl) { guard(ref('settings/home').set({ photo: dataUrl, updatedAt: Date.now() }), '儲存照片失敗'); },
      clearHomePhoto: function () { guard(ref('settings/home').delete(), '移除照片失敗'); },
      saveSettings: function (patch) { guard(ref('settings/main').set(patch, { merge: true }), '儲存設定失敗'); },
      addRate: function (rate, source) {

        return id;
      },
      addCat: function (name) {
        var order = data.cats.reduce(function (m, x) { return Math.max(m, x.order); }, 0) + 1;
        guard(ref('cats/' + newId('c_')).set({ name: name, order: order }), '新增分類失敗');

      renameCat: function (id, oldName, newName) {

      deleteCat: function (id) { guard(ref('cats/' + id).delete(), '刪除分類失敗'); },
      deleteRate: function (id) { guard(ref('rates/' + id).delete(), '刪除匯率失敗'); },
      clearAll: function () {

      exportJson: function () {

        data.expenses.forEach(function (e) { if (!keep['expenses/' + e.id]) ops.push(['delete', 'expenses/' + e.id]); });
        dayDocs.forEach(function (x) { if (!keep['days/' + x]) ops.push(['delete', 'days/' + x]); });
        if (Object.keys(d.settings).length) sets.push(['set', 'settings/main', cloneJson(d.settings)]); else ops.push(['delete', 'settings/main']);

  // ------------------------------------------------------------------ views
  function membersCard(asAcc) {

        paths += '<path d="M' + cx + ' ' + cy + ' L' + (cx + r * Math.cos(ang)).toFixed(2) + ' ' + (cy + r * Math.sin(ang)).toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + (cx + r * Math.cos(a2)).toFixed(2) + ' ' + (cy + r * Math.sin(a2)).toFixed(2) + ' Z" fill="' + col + '" stroke="#fff" stroke-width="1.5"/>';

      }

    }).forEach(function (e) {

  }
  function updateFormPreview() {
    var f = formState, q = function (id) { return $(id); };
    var amt = parseFloat(f.amount), rate = parseFloat(f.rate);
    var jpy = f.currency === 'JPY';
    q('f_twdPreview').textContent = (jpy && amt > 0 && rate > 0) ? '≈ ' + fmtTwd(amt * rate) : '';
    var shareEl = q('f_shares');
    if (amt > 0 && f.participantIds.length) {
      var ordered = state.members.filter(function (m) { return f.participantIds.indexOf(m.id) > -1; });
      var sh = splitMinor(minorOf(amt, f.currency), ordered.map(function (m) { return m.id; }));
      shareEl.textContent = ordered.map(function (m) { return m.name + ' ' + (jpy ? fmtYen(sh[m.id]) : fmtTwd(sh[m.id] / 100)); }).join('　');
    } else { shareEl.textContent = ''; }
    var tp = q('f_taxPreview');
    if (jpy && f.taxFree && amt > 0) {
      var t = taxInfo({ taxFree: true, currency: 'JPY', amount: Math.round(amt), taxRate: f.taxRate });
      tp.textContent = '未稅 ' + fmtYen(t.pretax) + '，稅金 ' + fmtYen(t.tax) + '（同店同日未稅滿 ' + fmtYen(TAX_THRESHOLD) + ' 才能退）';
    } else { tp.textContent = ''; }
    renderStoreHistory();
  }
  function openForm(exp, presetDate, prefill) {
    if (state.loading) { toast('資料還在讀取中，請稍候'); return; }
    if (!state.members.length) { state.tab = 'settings'; renderAll(); toast('請先新增旅伴'); return; }
    formState = exp ? formFromExpense(exp) : newFormState(presetDate);
    if (!exp && prefill) Object.keys(prefill).forEach(function (k) { formState[k] = prefill[k]; });
    formId = exp ? exp.id : null;
    var layer = $('sheetLayer');
    layer.innerHTML = formHtml(formState, !!exp);
    applyFormVisibility();
    var sheet = layer.querySelector('.sheet');
    sheet.addEventListener('input', function (e) {
      var id = e.target.id, f = formState;
      if (id === 'f_amount') f.amount = e.target.value;
      else if (id === 'f_rate') {
        f.rate = e.target.value;
        var rs = $('f_rateSelect'); if (rs) rs.value = matchingRateOptionValue(f.rate);
      }
      else if (id === 'f_title') f.title = e.target.value;
      else if (id === 'f_note') f.note = e.target.value;
      else if (id === 'f_store') f.store = e.target.value;
      else if (id === 'f_date') f.date = e.target.value;
      else return;
      updateFormPreview();
    });
    sheet.addEventListener('change', function (e) {
      var id = e.target.id, f = formState;
      if (id === 'f_payer') f.payerId = e.target.value;
      else if (id === 'f_taxfree') f.taxFree = e.target.checked;
      else if (id === 'f_consumed') f.consumed = e.target.checked;
      else if (id === 'f_date') f.date = e.target.value;
      else if (id === 'f_rateSelect') {
        if (e.target.value) { f.rate = e.target.value; var ri = $('f_rate'); if (ri) ri.value = f.rate; updateFormPreview(); }
        return;
      }
      else return;
      applyFormVisibility();
    });
    sheet.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('button') : null; if (!t) return;
      var f = formState;
      if (t.hasAttribute('data-pay-add')) addPayFromForm();
      else if (t.hasAttribute('data-pay')) { var pn = t.getAttribute('data-pay'); f.payMethod = f.payMethod === pn ? '' : pn; if (f.payMethod) lsSet('expenses.pay', f.payMethod); renderPayField(); }
      else if (t.hasAttribute('data-cat-add')) addCategory();
      else if (t.hasAttribute('data-cat-rename')) renameCategory(t.getAttribute('data-cat-rename'));
      else if (t.hasAttribute('data-cat-del')) deleteCategory(t.getAttribute('data-cat-del'));
      else if (t.hasAttribute('data-cat')) { f.category = t.getAttribute('data-cat'); applyFormVisibility(); }
      else if (t.hasAttribute('data-cur')) { f.currency = t.getAttribute('data-cur'); applyFormVisibility(); }
      else if (t.hasAttribute('data-store')) {
        f.store = t.getAttribute('data-store');
        var si = $('f_store'); si.value = f.store; si.blur();
        updateFormPreview();
      }
      else if (t.hasAttribute('data-taxrate')) { f.taxRate = Number(t.getAttribute('data-taxrate')); applyFormVisibility(); }
      else if (t.hasAttribute('data-part')) {
        var id = t.getAttribute('data-part'), i = f.participantIds.indexOf(id);
        if (i > -1) f.participantIds.splice(i, 1); else f.participantIds.push(id);
        applyFormVisibility();
      }
      else if (t.hasAttribute('data-allparts')) { f.participantIds = state.members.map(function (m) { return m.id; }); applyFormVisibility(); }
      else if (t.getAttribute('data-f') === 'cancel') closeForm();
      else if (t.getAttribute('data-f') === 'save') saveForm();
      else if (t.getAttribute('data-f') === 'delete') {
        confirmBox('確定要刪除這筆帳目嗎？', '刪除', function () {
          Store.deleteExpense(formId);
          closeForm();
        });
      }
    });
    if (!exp) setTimeout(function () { var a = $('f_amount'); if (a) a.focus(); }, 60);
  }
  function closeForm() {
    $('sheetLayer').innerHTML = '';
    formState = null; formId = null;
    syncBodyScroll();
    if (renderPending) renderView();
  }
  function setFormError(msg) { var el = $('fError'); if (el) el.textContent = msg || ''; }
  function saveForm() {
    var f = formState; if (!f) return;
    var amount = parseFloat(f.amount), rate = parseFloat(f.rate);
    if (!(amount > 0)) { setFormError('請輸入金額'); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date || '')) { setFormError('請選日期'); return; }
    var jpy = f.currency === 'JPY';
    if (jpy) { amount = Math.round(amount); if (!(rate > 0)) { setFormError('請輸入匯率（1 日圓 = ? 台幣）'); return; } }
    else { amount = Math.round(amount * 100) / 100; rate = 1; }
    if (!f.payerId) { setFormError('請選擇誰付的'); return; }
    if (!f.participantIds.length) { setFormError('請至少選一位分攤的人'); return; }
    var canTax = jpy && isGoods(f.category);
    var taxFree = canTax && f.taxFree;
    if (taxFree && !String(f.store).trim()) { setFormError('請填店名，同一家店同一天才會合併計算門檻'); return; }
    var ordered = state.members.filter(function (m) { return f.participantIds.indexOf(m.id) > -1; }).map(function (m) { return m.id; });
    var existing = null;
    if (formId) state.expenses.forEach(function (e) { if (e.id === formId) existing = e; });
    var data = {
      date: f.date, title: String(f.title).trim() || f.category, category: f.category, currency: f.currency,
      amount: amount, rate: rate, payerId: f.payerId, participantIds: ordered,
      taxFree: !!taxFree, store: taxFree ? String(f.store).trim() : '', taxRate: Number(f.taxRate) || 10, consumed: !!(taxFree && f.consumed),
      createdAt: existing && existing.createdAt ? existing.createdAt : Date.now(),
      note: String(f.note || '').trim(), payMethod: f.payMethod || ''
    };
    setAccClosed('day:' + data.date, false);
    if (formId) Store.setExpense(formId, data); else Store.addExpense(data);
    if (jpy && state.rate !== rate) Store.saveSettings({ rate: rate });
    closeForm();
  }

  // ------------------------------------------------------------------ side drawer (glossary + refund cheat sheet)
  var GLOSSARY = [
    ['合計／お会計', '總計。記帳要填的是含稅的這個數字'],
    ['小計', '小計，不一定是最後要付的金額'],
    ['税込／税抜', '含稅／未稅'],
    ['内消費税（等）', '內含的消費稅金額'],
    ['8%対象／10%対象', '適用 8%／10% 稅率的金額'],
    ['軽減税率、※', '適用 8% 的減稅稅率商品，常用 ※ 標記'],
    ['免税', '免稅'],
    ['お預り／お釣り', '你給的錢／找零'],
    ['現金／クレジット', '現金／信用卡']
  ];
  function drawerHtml() {
    var rows = GLOSSARY.map(function (g) {
      var term = g[0].split('／').map(function (part) { return '<span class="nw">' + esc(part) + '</span>'; }).join('／<wbr>');
      return '<tr><td class="jp">' + term + '</td><td>' + esc(g[1]) + '</td></tr>';
    }).join('');
    return '<div class="dhead"><b>對照表與退稅小抄</b><button class="dclose" id="drawerClose" aria-label="關閉">✕</button></div>' +
      '<div class="dsec"><h4>收據對照表</h4><table class="gloss">' + rows + '</table>' +
      '<div class="muted" style="margin-top:8px">看不懂時，可以用 iPhone 的「翻譯」App 相機。出發前先下載日文語言包，就能離線使用。金額和稅率請自己再看一眼。</div></div>' +
      '<div class="dsec"><h4>離境當天檢查清單</h4><div class="muted">日本觀光廳規定（2026年11月起適用）</div><ol class="steps">' +
      '<li>到機場後，先找<b>免稅手續機台</b>（出境大廳，在託運行李<b>之前</b>）</li>' +
      '<li>免稅商品和收據都帶在身邊，不要先託運</li>' +
      '<li>掃護照：綠燈＝完成；紅燈＝把商品帶到海關查驗區</li>' +
      '<li>成田也可用 Visit Japan Web，在專用Wi‑Fi區網路辦理（到安檢前）</li>' +
      '<li>已經吃掉或用掉的商品，不要在機台辦理，改向海關櫃台說明</li>' +
      '<li>辦完退稅，再託運行李、報到登機</li></ol></div>' +
      '<div class="dsec"><h4>記帳時的重點</h4><ul class="notes">' +
      '<li>同一家店、同一天，<b>未稅</b>合計滿 ¥5,000 才能退</li>' +
      '<li>整張收據一起算：少一件或吃掉一件，整張都不能退。要吃掉／用掉的和要帶回台灣的，請分開結帳、分開記帳</li>' +
      '<li>只有「商品」能退，餐飲、住宿、交通、門票不行</li>' +
      '<li>店名請每次寫一樣，才會合併計算</li>' +
      '<li>退款方式和手續費依店家而定，結帳時記得問</li></ul></div>';
  }
  var drawerOpen = false;
  function syncBodyScroll() { /* the page behind is locked by the host while this screen is open */ }
  function openDrawer() {
    var d = $('drawer');
    drawerOpen = true; d.scrollTop = 0;
    d.className = 'drawer open'; d.setAttribute('aria-hidden', 'false');
    $('drawerMask').className = 'dmask open';
    syncBodyScroll();
  }
  function closeDrawer() {
    var d = $('drawer');
    drawerOpen = false;
    d.className = 'drawer'; d.setAttribute('aria-hidden', 'true');
    $('drawerMask').className = 'dmask';
    syncBodyScroll();
  }
  function bindDrawer() {
    $('drawer').innerHTML = drawerHtml();
    $('drawerHandle').addEventListener('click', openDrawer);
    $('drawerMask').addEventListener('click', closeDrawer);
    $('drawerClose').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && drawerOpen) closeDrawer(); });
    // swipe: right from the left edge opens, left inside the drawer closes (mostly-horizontal drags only)
    function swipe(el, onSwipe) {
      var sx = null, sy = null;
      el.addEventListener('touchstart', function (e) { var t = e.touches && e.touches[0]; if (t) { sx = t.clientX; sy = t.clientY; } }, { passive: true });
      el.addEventListener('touchend', function (e) {
        var t = e.changedTouches && e.changedTouches[0];
        if (sx !== null && t) { var dx = t.clientX - sx, dy = t.clientY - sy; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) onSwipe(dx); }
        sx = null; sy = null;
      }, { passive: true });
    }
    swipe($('edgeStrip'), function (dx) { if (dx > 0) openDrawer(); });
    swipe($('drawer'), function (dx) { if (dx < 0) closeDrawer(); });
  }

  // ------------------------------------------------------------------ events
  function bindStatic() {
    $('fab').addEventListener('click', function () { openForm(null); });
    $('subFabs').addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-sub-toggle]') : null;
      if (t) { state.subOpen = !state.subOpen; renderTabs(); return; }
      var b = e.target.closest ? e.target.closest('[data-sub]') : null; if (!b) return;
      state.sub = b.getAttribute('data-sub'); state.subOpen = false; renderTabs(); renderView(true); $('scroll').scrollTop = 0;
    });
    $('fabRate').addEventListener('click', fetchRateNow);
    $('banner').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null; if (!b) return;
      if (b.hasAttribute('data-mig-upload')) uploadLocalData(b);
      else if (b.hasAttribute('data-mig-skip')) { lsSet('expenses.migrateSkip', '1'); renderBanner(); }
    });
    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-tab]') : null; if (!b) return;
      state.tab = b.getAttribute('data-tab'); renderTabs(); renderView(true); $('scroll').scrollTop = 0;
    });
    var view = $('view');
    view.addEventListener('click', function (e) {
      if (state.subOpen) { state.subOpen = false; renderTabs(); }         // tapping elsewhere folds the menu
      var t = e.target.closest ? e.target.closest('button') : null; if (!t) return;
      if (t.hasAttribute('data-acc-toggle')) toggleAcc(t.closest('.acc'));
      else if (t.hasAttribute('data-day-add')) openForm(null, t.getAttribute('data-day-add'));
      else if (t.hasAttribute('data-day-menu')) openDayMenu(t.getAttribute('data-day-menu'));
      else if (t.hasAttribute('data-edit')) {
        var id = t.getAttribute('data-edit'), found = null;
        state.expenses.forEach(function (x) { if (x.id === id) found = x; });
        if (found) openForm(found);
      }
      else if (t.hasAttribute('data-add-member')) {
        var inp = $('newMember');
        var v = inp ? inp.value : '';
        if (addMember(v) && inp) inp.value = '';
        renderView(true);
        var again = $('newMember'); if (again && !v.trim()) again.focus();
      }
      else if (t.hasAttribute('data-open-drawer')) openDrawer();
      else if (t.hasAttribute('data-mig-upload')) uploadLocalData(t);
      else if (t.hasAttribute('data-export')) openExport();
      else if (t.hasAttribute('data-import')) openImport();
      else if (t.hasAttribute('data-clear')) clearAllData();
      else if (t.hasAttribute('data-del-member')) deleteMember(t.getAttribute('data-del-member'));
      else if (t.hasAttribute('data-rename')) renameMember(t.getAttribute('data-rename'));
      else if (t.hasAttribute('data-add-rate-manual')) addRateManual();
      else if (t.hasAttribute('data-fetch-rate')) fetchRateNow();
      else if (t.hasAttribute('data-report-pdf')) exportReportPdf();
      else if (t.hasAttribute('data-del-rate')) deleteRate(t.getAttribute('data-del-rate'));
      else if (t.hasAttribute('data-sub')) { state.sub = t.getAttribute('data-sub'); renderTabs(); renderView(true); }
      else if (t.hasAttribute('data-home-photo-pick')) { var hp = $('homePhotoPick'); if (hp) hp.click(); }
      else if (t.hasAttribute('data-home-photo-clear')) confirmBox('確定要移除封面照片嗎？', '移除', function () { Store.clearHomePhoto(); });
      else if (t.hasAttribute('data-goto-settings')) { state.tab = 'settings'; renderTabs(); renderView(true); $('scroll').scrollTop = 0; }
      else if (t.hasAttribute('data-scan-cam')) { var c1 = $('scanCam'); if (c1) c1.click(); }
      else if (t.hasAttribute('data-scan-pick')) { var c2 = $('scanPick'); if (c2) c2.click(); }
      else if (t.hasAttribute('data-scan-reset')) { state.scan = { phase: 'idle', img: '', res: null, err: '' }; renderView(true); }
      else if (t.hasAttribute('data-scan-go')) scanToForm();
      else if (t.hasAttribute('data-scan-cur')) { if (state.scan.res) { state.scan.res.currency = t.getAttribute('data-scan-cur'); state.scan.res.otherCurrency = ''; renderView(true); } }
      else if (t.hasAttribute('data-pay-add')) addPay();
      else if (t.hasAttribute('data-pay-rename')) renamePay(+t.getAttribute('data-pay-rename'));
      else if (t.hasAttribute('data-pay-del')) deletePay(+t.getAttribute('data-pay-del'));
      else if (t.hasAttribute('data-pay-reset')) Store.setPayMethods(DEFAULT_PAYS.slice());
    });
    view.addEventListener('input', function (e) {
      var r = state.scan && state.scan.res; if (!r) return;
      if (e.target.id === 's_store') r.store = e.target.value;
      else if (e.target.id === 's_amount') r.amount = e.target.value;
    });
    view.addEventListener('change', function (e) {
      var id = e.target.id;
      if (id === 'homePhotoPick' && e.target.files && e.target.files[0]) { var hf = e.target.files[0]; e.target.value = ''; openCropper(hf); return; }
      if ((id === 'scanCam' || id === 'scanPick') && e.target.files && e.target.files[0]) { var f = e.target.files[0]; e.target.value = ''; handleScanFile(f); }
      else if (id === 's_tax' && state.scan.res) state.scan.res.taxFree = e.target.checked;
      else if (e.target.hasAttribute && e.target.hasAttribute('data-report-sel')) { state.reportSel[e.target.getAttribute('data-report-sel')] = e.target.checked; renderView(true); }
    });
    view.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.id === 'newMember') {
        var v = e.target.value;
        if (addMember(v)) e.target.value = '';
        renderView(true);
        var again = $('newMember'); if (again) again.focus();
      }
    });
    view.addEventListener('change', function (e) {
      if (e.target.id === 'meSelect') lsSet('expenses.me', e.target.value);
    });
    view.addEventListener('focusout', function () {
      setTimeout(function () { if (renderPending && !viewHasFocusedInput()) renderView(); }, 250);
    });
  }

  // ------------------------------------------------------------------ boot (called once, with the shadow root)
  function mount(shadowRoot) {
    root = shadowRoot;
    if (lsGet('expenses.howto') === 'closed') { setAccClosed('howto', true); try { window.localStorage.removeItem('expenses.howto'); } catch (e) { /* ignore */ } }   // older versions
    bindStatic();
    bindDrawer();
    Store.start({
      onHome: function (p) { state.homePhoto = p || ''; renderView(); },
      onMembers: function (list) { state.members = list.sort(function (a, b) { return (a.order || 0) - (b.order || 0); }); renderAll(); },
      onExpenses: function (list) { state.expenses = list; renderView(); },
      onDays: function (list) { state.days = list.map(function (d) { return d.date; }).sort(); renderView(); },
      onSettings: function (st) { state.rate = st && st.rate > 0 ? Number(st.rate) : null; state.pays = (st && st.payMethods && st.payMethods.length) ? st.payMethods.slice() : DEFAULT_PAYS.slice(); if (formState) renderPayField(); renderView(); },
      onRates: function (list) { state.rates = list; renderView(); },
      onCats: function (list) { state.cats = list; if (formState) renderCatGrid(); },
      onStatus: function (st) {
        if (st.message !== undefined) state.storageMessage = st.message;
        if (st.sync) { state.sync = st.sync; if (st.sync === 'synced') state.storageMessage = ''; }
        renderBanner(); renderModeTag();
      },
      onReady: function () { state.loading = false; state.localInfo = Store.localInfo(); renderAll(); }
    });
    renderAll();
  }
  window.ExpenseApp = { mount: mount };
})();
</script>
<script>
(function () {
  "use strict";
  // Hosts the expense screen inside this page: an isolated container (shadow DOM) so its styles and ids can never
  // clash with the guide, started at page load so the data is already here when the wallet icon is tapped.
  var host = document.getElementById('expHost');
  var isOpen = false, pushed = false, mounted = false;
  function mountOnce() {
    if (mounted) return; mounted = true;
    try {
      var shadow = host.attachShadow({ mode: 'open' });
      shadow.appendChild(document.getElementById('expTemplate').content.cloneNode(true));
      window.ExpenseApp.mount(shadow);
      shadow.getElementById('expBack').addEventListener('click', close);
    } catch (e) { console.error('expense screen failed to start', e); }
  }
  function hide() {
    if (!isOpen) return;
    isOpen = false; host.classList.remove('open'); document.body.style.overflow = '';
  }
  function open() {
    if (isOpen) return;
    isOpen = true; host.classList.add('open'); document.body.style.overflow = 'hidden';
    try { history.pushState({ exp: 1 }, ''); pushed = true; } catch (e) { pushed = false; }   // so the phone's back gesture closes it
  }
  function close() {
    if (pushed) {
      pushed = false;
      try { history.back(); setTimeout(hide, 350); return; } catch (e) { /* fall through */ }
    }
    hide();
  }
  window.addEventListener('popstate', function () { pushed = false; hide(); });
  window.ExpenseHost = { open: open, close: close, isOpen: function () { return isOpen; } };
  mountOnce();
})();
</script>
