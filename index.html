    ticket: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B9713F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 C3 7.5 4 7 5.5 7 L18.5 7 C20 7 21 7.5 21 9 L21 10.5 A2 2 0 0 0 21 13.5 L21 15 C21 16.5 20 17 18.5 17 L5.5 17 C4 17 3 16.5 3 15 L3 13.5 A2 2 0 0 0 3 10.5 Z"/><path d="M10 7 L10 17" stroke-dasharray="2 2"/></svg>'
  };

  // ---------------------------------------------------------------------
  // Render
  // ---------------------------------------------------------------------
  function render() {
    var day = dayById(state.activeDayId);
    var app = document.getElementById('app');

    var tabsHtml = DAYS.map(function (d) {
      var active = d.id === state.activeDayId;
      var style = active
        ? 'background:#8B5E34;color:#fff;box-shadow:0 3px 8px rgba(139,94,52,0.3);'
        : 'background:#fff;color:#8B5E34;border:1.5px solid #EADFCB;';
      return '<button class="pill" style="' + style + '" data-day="' + d.id + '">' + esc(d.label) + '</button>';
    }).join('');

    var itemsHtml = day.items.map(function (it) {
      return '<div style="display:flex;gap:9px;align-items:flex-start;">' +
        '<div style="flex-shrink:0;width:46px;text-align:center;background:#FBEADA;border-radius:7px;padding:4px 3px;font-weight:600;font-size:10.5px;color:#B9713F;">' + esc(it.time) + '</div>' +
        '<div style="flex-grow:1;"><div style="font-weight:700;font-size:12.5px;color:#4A3626;">' + esc(it.name) + '</div>' +
        '<div style="font-size:11.5px;color:#8A7159;margin-top:1px;line-height:1.4;">' + esc(it.desc) + '</div></div></div>';
    }).join('<div style="height:10px;"></div>');

    var remaining = state.checklist.filter(function (c) { return c.dayId === state.activeDayId && !c.checked; }).length;
    var badgeHtml = remaining > 0
      ? '<span style="position:absolute;top:-3px;right:-3px;background:#E8A085;color:#fff;font-size:8px;font-weight:700;border-radius:999px;padding:1px 4px;line-height:1.3;">' + remaining + '</span>'
      : '';

    app.innerHTML =
      '<div style="width:100%;min-height:100vh;background:#FBF1E4;position:relative;">' +
        '<div style="width:100%;background:linear-gradient(135deg,#E8B98C 0%,#D9986A 100%);padding:26px 16px 20px;position:relative;overflow:hidden;">' +
          '<div style="max-width:480px;margin:0 auto;position:relative;z-index:1;">' +
            '<div style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.85);border-radius:999px;padding:5px 12px;margin-bottom:10px;">' + ICO.plane + '<span style="font-weight:600;font-size:11px;color:#8B5E34;">TRAVEL GUIDE</span></div>' +
            '<h1 style="margin:0 0 6px;font-weight:700;font-size:22px;color:#5A3A1E;line-height:1.3;max-width:78%;">東京親子7日遊懶人包</h1>' +
            '<p style="margin:0;font-size:11.5px;color:#6B4425;line-height:1.6;max-width:78%;">12/04（五）06:40起飛．10:40抵達成田機場．7天6夜．親子出遊</p>' +
          '</div>' +
          '<svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1" style="position:absolute;right:-20px;top:-20px;opacity:0.2;"><path d="M2 16 L22 8 L18 13 L22 18 L2 16 Z"/><path d="M9 13 L9 20 L6 18"/></svg>' +
        '</div>' +

        '<div class="toolbar">' +
          '<button class="btn-icon" data-open-modal="weather">' + ICO.weather + '</button>' +
          '<button class="btn-icon" data-open-modal="transport">' + ICO.bus + '</button>' +
          '<button class="btn-icon" data-open-modal="map">' + ICO.pin + '</button>' +
          '<button class="btn-icon" data-open-modal="checklist" style="position:relative;">' + ICO.check + badgeHtml + '</button>' +
        '</div>' +

        '<div class="wrap">' +
          ((state.dbError || (state.dbChecked && !state.dbReady))
            ? '<div style="background:#FDF0E4;border:1.5px solid #F0C9A0;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:11.5px;color:#A65C1E;line-height:1.6;">目前連不上資料庫，景點與清單暫時是唯讀，新增／刪除／打勾不會被存起來。' + (state.dbError ? '<br>原因：' + esc(state.dbError) : '') + '</div>'
            : '') +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">' + tabsHtml + '</div>' +
          '<div class="card">' +
            '<div class="card-head">' + ICO.pin.replace('16','18').replace('16','18') + '<h3>' + esc(day.title) + '</h3></div>' +
            '<div style="display:flex;flex-direction:column;">' + itemsHtml + '</div>' +
          '</div>' +
          '<div style="text-align:center;font-size:11px;color:#B49A7F;padding:4px 20px;">點右上角的圈圈圖示，查看當天的天氣、交通、地圖、準備清單</div>' +
          '<div style="height:6px;"></div>' +
          '<div style="text-align:center;font-size:11px;color:#B49A7F;">住宿資訊、一鍵訂票連結收在左側選單，點左側把手打開</div>' +
        '</div>' +

        renderQuickModal(day) +
        renderConfirmAndAddOverlays() +

        '<button class="handle" id="drawerHandle">' + ICO.arrow + '</button>' +
        '<div class="edge-strip" id="edgeStrip"></div>' +
        (state.drawerOpen ? '<div class="modal-mask" id="drawerMask" style="z-index:50;"></div>' : '') +
        renderDrawer() +
      '</div>';

    bindEvents();
  }

  function renderQuickModal(day) {
    if (!state.quickModal) return '';
    var titleMap = { weather: '當天天氣重點', transport: '當天交通攻略', map: '當天景點地圖', checklist: '當天準備清單' };
    var body = '';

    if (state.quickModal === 'weather') {
      body =
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">' +
          statBox('平均高溫', '11.9度') + statBox('平均氣溫', '7.6度') + statBox('平均低溫', '3.5度') +
        '</div>' +
        '<div style="background:#FDF0E4;border:1.5px solid #F0C9A0;border-radius:11px;padding:11px;font-size:12px;color:#A65C1E;line-height:1.6;margin-bottom:10px;">' + esc(day.weatherNote) + '</div>' +
        '<a href="' + JMA_URL + '" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:space-between;gap:8px;background:#FBF1E4;border-radius:11px;padding:11px 13px;">' +
          '<div><div style="font-size:12px;font-weight:700;color:#4A3626;">查看即時天氣預報</div><div style="font-size:10px;color:#9C8770;margin-top:1px;">日本氣象廳官方 東京都預報</div></div>' +
          '<div style="flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;">' + ICO.arrow + '</div>' +
        '</a>' +
        '<div style="font-size:9.5px;color:#B49A7F;margin-top:6px;line-height:1.5;">以上溫度為歷年12月平均值，非即時預報；建議出發前幾天點上方連結查詢當週實際天氣</div>';
    }

    if (state.quickModal === 'transport') {
      if (day.othersArranged) {
        body += '<div style="background:#FBF1E4;border-radius:11px;padding:12px;font-size:12px;color:#6B4425;line-height:1.6;margin-bottom:8px;">' + esc(day.othersNote) + '</div>';
      }
      body += day.transport.map(function (tbl) {
        var rows = tbl.rows.map(function (row) {
          return '<div style="display:flex;flex-direction:column;gap:1px;background:#fff;border-radius:8px;padding:7px 9px;font-size:11px;">' +
            '<span style="color:#4A3626;font-weight:600;">' + esc(row.route) + '</span>' +
            '<div style="display:flex;justify-content:space-between;"><span style="color:#9C8770;">' + esc(row.time) + '</span><span style="color:#B9713F;font-weight:700;">' + esc(row.price) + '</span></div></div>';
        }).join('<div style="height:6px;"></div>');
        var tips = tbl.tips.map(function (t) {
          return '<div style="font-size:10.5px;color:#7A5426;line-height:1.5;display:flex;gap:4px;"><span style="flex-shrink:0;">・</span><span>' + esc(t) + '</span></div>';
        }).join('<div style="height:4px;"></div>');
        return '<div style="background:#FBF1E4;border-radius:12px;padding:11px;margin-bottom:8px;">' +
          '<div style="font-weight:700;font-size:12px;color:#4A3626;margin-bottom:2px;">' + esc(tbl.title) + '</div>' +
          '<div style="font-size:10px;color:#9C8770;margin-bottom:8px;">' + esc(tbl.subtitle) + '</div>' +
          '<div style="margin-bottom:9px;">' + rows + '</div>' +
          '<div style="background:#FDF0E4;border:1.5px solid #F0C9A0;border-radius:10px;padding:10px;">' +
            '<div style="display:flex;align-items:center;gap:5px;margin-bottom:6px;">' + ICO.warn + '<span style="font-size:10.5px;font-weight:700;color:#A65C1E;">注意事項與應變</span></div>' +
            tips +
          '</div></div>';
      }).join('');
    }

    if (state.quickModal === 'map') {
      var places = state.places.filter(function (p) { return p.dayId === state.activeDayId; }).sort(function (a, b) { return a.order - b.order; });
      var placesHtml = places.map(function (p, idx) {
        var dragCls = state.dragPlaceId === p.id ? ' dragging' : '';
        return '<div class="place-row' + dragCls + '" data-place-id="' + p.id + '" data-idx="' + idx + '">' +
          '<div class="drag-handle" data-drag-handle="' + p.id + '">' + ICO.drag + '</div>' +
          '<a href="' + esc(p.url) + '" target="_blank" rel="noopener" style="flex-grow:1;min-width:0;">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">' +
              '<div style="font-size:12.5px;font-weight:700;color:#4A3626;">' + esc(p.name) + '</div>' + ICO.pinSmall +
            '</div>' +
            '<div style="font-size:10.5px;color:#A6875F;line-height:1.5;margin-top:4px;">' + esc(p.note) + '</div>' +
          '</a>' +
          '<button data-del-place="' + p.id + '" style="flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#F6E2DC;border:none;display:flex;align-items:center;justify-content:center;">' + ICO.xSmall + '</button>' +
        '</div>';
      }).join('<div style="height:7px;"></div>');
      if (!places.length) placesHtml = '<div style="font-size:12px;color:#B49A7F;text-align:center;padding:16px 0;">這天還沒有加景點，點上面「＋」新增</div>';
      body = '<div id="placesList" style="display:flex;flex-direction:column;">' + placesHtml + '</div>';
    }

    if (state.quickModal === 'checklist') {
      var items = state.checklist.filter(function (c) { return c.dayId === state.activeDayId; }).sort(function (a, b) { return a.order - b.order; });
      var itemsHtml2 = items.map(function (it) {
        if (state.editingChecklistId === it.id) {
          return '<div style="display:flex;align-items:center;gap:9px;">' +
            '<div style="width:18px;"></div>' +
            '<input type="text" id="editChecklistInput" value="' + esc(state.editingChecklistText) + '" placeholder="輸入項目內容" style="flex-grow:1;border:1.5px solid #EADFCB;border-radius:8px;padding:6px 9px;font-size:12.5px;background:#FFFFFF;color:#4A3626;">' +
          '</div>';
        }
        var labelStyle = it.checked ? 'color:#B49A7F;text-decoration:line-through;' : 'color:#4A3626;';
        return '<div style="display:flex;align-items:center;gap:9px;">' +
          '<input type="checkbox" data-toggle-check="' + it.id + '" ' + (it.checked ? 'checked' : '') + '>' +
          '<label data-edit-check="' + it.id + '" style="' + labelStyle + 'font-size:12.5px;cursor:pointer;flex-grow:1;">' + esc(it.label || '（點擊輸入內容）') + '</label>' +
        '</div>';
      }).join('<div style="height:9px;"></div>');
      if (!items.length) itemsHtml2 = '<div style="font-size:12px;color:#B49A7F;text-align:center;padding:16px 0;">這天還沒有準備項目，點上面「＋」新增</div>';
      body = '<div style="display:flex;flex-direction:column;">' + itemsHtml2 + '</div>';
    }

    var addBtn = (state.quickModal === 'map' || state.quickModal === 'checklist')
      ? '<button id="quickAddBtn" class="close-x" style="margin-right:6px;">' + ICO.plus + '</button>'
      : '';

    return '<div class="modal-mask" id="quickMask" style="z-index:60;"></div>' +
      '<div class="modal-box" style="z-index:61;">' +
        '<div class="modal-head">' +
          '<span style="font-weight:700;font-size:14.5px;color:#5A3A1E;">' + titleMap[state.quickModal] + '</span>' +
          '<div style="display:flex;align-items:center;">' + addBtn + '<button id="quickCloseBtn" class="close-x">' + ICO.x + '</button></div>' +
        '</div>' +
        body +
      '</div>';
  }

  function renderConfirmAndAddOverlays() {
    var out = '';
    if (state.confirmDeletePlaceId) {
      var target = state.places.filter(function (p) { return p.id === state.confirmDeletePlaceId; })[0];
      out += '<div class="modal-mask" style="z-index:70;" data-confirm-cancel="1"></div>' +
        '<div class="modal-box" style="z-index:71;max-width:300px;padding:18px;">' +
          '<div style="font-size:13.5px;color:#4A3626;margin-bottom:14px;line-height:1.6;">確定要移除「' + esc(target ? target.name : '') + '」嗎？</div>' +
          '<div style="display:flex;gap:8px;">' +
            '<button data-confirm-cancel="1" style="flex:1;padding:10px;border-radius:10px;border:1.5px solid #EADFCB;background:#fff;color:#8B5E34;font-weight:700;font-size:13px;">取消</button>' +
            '<button data-confirm-del="1" style="flex:1;padding:10px;border-radius:10px;border:none;background:#C0524B;color:#fff;font-weight:700;font-size:13px;">確定移除</button>' +
          '</div>' +
        '</div>';
    }
    if (state.addPlaceOpen) {
      var errHtml = state.addPlaceError
        ? '<div style="background:#FBEAEA;color:#B84343;font-size:11px;padding:7px 9px;border-radius:8px;margin-bottom:6px;line-height:1.5;">' + esc(state.addPlaceError) + '</div>'
        : '';
      out += '<div class="modal-mask" style="z-index:70;" data-add-cancel="1"></div>' +
        '<div class="modal-box-top" id="addPlaceBox">' +
          '<div style="font-weight:700;font-size:12.5px;color:#5A3A1E;margin-bottom:6px;">新增景點</div>' +
          errHtml +
          '<div style="display:flex;flex-direction:column;gap:5px;">' +
            labeledInput('地點名稱', 'newPlaceName', state.newPlace.name) +
            labeledInput('Google地圖網址', 'newPlaceUrl', state.newPlace.url) +
            labeledInput('備註', 'newPlaceNote', state.newPlace.note) +
          '</div>' +
          '<div style="display:flex;gap:6px;margin-top:8px;">' +
            '<button data-add-cancel="1" style="flex:1;padding:6px;border-radius:8px;border:1.5px solid #EADFCB;background:#fff;color:#8B5E34;font-weight:700;font-size:12px;">取消</button>' +
            '<button data-add-confirm="1" style="flex:1;padding:6px;border-radius:8px;border:none;background:#8B5E34;color:#fff;font-weight:700;font-size:12px;">新增</button>' +
          '</div>' +
        '</div>';
    }
    return out;
  }

  function statBox(label, value) {
    return '<div style="flex:1 1 30%;background:#FBF1E4;border-radius:10px;padding:8px;text-align:center;">' +
      '<div style="font-size:9px;color:#9C8770;">' + label + '</div>' +
      '<div style="font-weight:700;font-size:15px;color:#B9713F;">' + value + '</div></div>';
  }

  function labeledInput(label, key, value) {
    return '<input type="text" id="' + key + '" value="' + esc(value) + '" placeholder="' + label + '" style="width:100%;border:1.5px solid #EADFCB;border-radius:8px;padding:0 9px;font-size:12px;height:30px;background:#FFFFFF;color:#4A3626;">';
  }

    var bookingHtml = BOOKING_LINKS.map(function (bk) {
      return '<a href="' + bk.url + '" target="_blank" rel="noopener" class="booking-row">' +
        '<div><div style="font-size:10.5px;font-weight:700;color:#4A3626;">' + esc(bk.label) + '</div><div style="font-size:9px;color:#9C8770;margin-top:1px;">' + esc(bk.desc) + '</div></div>' +
        '<div style="flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#FBEADA;display:flex;align-items:center;justify-content:center;">' + ICO.arrow + '</div>' +
      '</a>';
    }).join('<div style="height:6px;"></div>');

    return '<div class="drawer' + (state.drawerOpen ? ' open' : '') + '" id="drawer">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 4px;">' +
        '<span style="font-weight:700;font-size:14px;color:#5A3A1E;">參考資料</span>' +
        '<button id="drawerCloseBtn" class="close-x">' + ICO.x + '</button>' +
      '</div>' +
      '<div style="font-size:10px;color:#9C8770;padding:0 4px 12px;">這兩項不隨天數變化，全程通用</div>' +
      '<div style="background:#FBF1E4;border-radius:13px;margin-bottom:10px;padding:12px;">' +
        '<div style="display:flex;align-items:center;gap:7px;margin-bottom:8px;">' + ICO.home + '<span style="font-weight:700;font-size:12.5px;color:#5A3A1E;">住宿資訊</span></div>' +
        '<h3 style="margin:0 0 3px;font-size:12px;color:#4A3626;">SCD155 池袋商圈大別墅</h3>' +
        '<div style="font-size:9.5px;color:#9C8770;margin-bottom:7px;">1-chōme-5 Kamiikebukuro, Toshima City, Tokyo 170-0012</div>' +
        '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;">' +
          '<span class="tag" style="font-size:9px;padding:3px 7px;">7間臥室</span><span class="tag" style="font-size:9px;padding:3px 7px;">1間衛浴</span>' +
          '<span class="tag" style="font-size:9px;padding:3px 7px;">最多9人</span><span class="tag" style="font-size:9px;padding:3px 7px;">評分4.6</span>' +
        '</div>' +
        '<div style="font-size:10.5px;color:#6B4425;line-height:1.7;margin-bottom:8px;">・池袋站步行約10-15分鐘，8條地鐵線可達東京各大景點<br>・入住 15:00 後、退房 12:00 前<br>・飯店不提供行李寄放，退房後需自行前往車站置物櫃</div>' +
        '<div style="background:#fff;border-radius:10px;padding:9px;">' +
          '<div style="font-size:10px;font-weight:700;color:#B9713F;margin-bottom:4px;">為什麼沒有「房型比較」？</div>' +
          '<div style="font-size:9.5px;color:#6B4425;line-height:1.6;">這是整棟包棟villa（一次租下全部7間房），不是傳統飯店按房型分開訂房，沒有標準房/豪華房的價格分級。</div>' +
        '</div>' +
        '<a href="' + HOTEL_MAP_URL + '" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:space-between;gap:6px;background:#fff;border-radius:9px;padding:8px 10px;margin-top:8px;">' +
          '<span style="font-size:10.5px;font-weight:700;color:#4A3626;">在地圖中開啟</span>' + ICO.arrow +
        '</a>' +
      '</div>' +
      '<div style="background:#FBF1E4;border-radius:13px;padding:12px;">' +
        '<div style="display:flex;align-items:center;gap:7px;margin-bottom:9px;">' + ICO.ticket + '<span style="font-weight:700;font-size:12.5px;color:#5A3A1E;">一鍵訂票連結</span></div>' +
        bookingHtml +
      '</div>' +
    '</div>';
  }

  // ---------------------------------------------------------------------
  // Events
  // ---------------------------------------------------------------------
  function bindEvents() {
    var app = document.getElementById('app');

    fitAddPlaceBox();

    Array.prototype.forEach.call(app.querySelectorAll('[data-day]'), function (el) {
      el.addEventListener('click', function () { state.activeDayId = el.getAttribute('data-day'); state.quickModal = null; render(); });
    });

    Array.prototype.forEach.call(app.querySelectorAll('[data-open-modal]'), function (el) {
      el.addEventListener('click', function () { state.quickModal = el.getAttribute('data-open-modal'); render(); });
    });

    var qClose = document.getElementById('quickCloseBtn');
    if (qClose) qClose.addEventListener('click', function () { state.quickModal = null; state.addPlaceOpen = false; state.confirmDeletePlaceId = null; state.editingChecklistId = null; render(); });
    var qMask = document.getElementById('quickMask');
    if (qMask) qMask.addEventListener('click', function () { state.quickModal = null; state.addPlaceOpen = false; state.confirmDeletePlaceId = null; state.editingChecklistId = null; render(); });

    var qAdd = document.getElementById('quickAddBtn');
    if (qAdd) qAdd.addEventListener('click', function () {

    // map: delete
    Array.prototype.forEach.call(app.querySelectorAll('[data-del-place]'), function (el) {
      el.addEventListener('click', function (e) { e.preventDefault(); state.confirmDeletePlaceId = el.getAttribute('data-del-place'); render(); });

    Array.prototype.forEach.call(confirmCancelEls, function (el) { el.addEventListener('click', function () { state.confirmDeletePlaceId = null; render(); }); });
    var confirmDelEl = app.querySelector('[data-confirm-del]');
    if (confirmDelEl) confirmDelEl.addEventListener('click', function () {

      state.confirmDeletePlaceId = null;
      deletePlace(id);
    });

    // map: add place modal
    var addCancelEls = app.querySelectorAll('[data-add-cancel]');
    Array.prototype.forEach.call(addCancelEls, function (el) { el.addEventListener('click', function () { state.addPlaceOpen = false; state.addPlaceError = ''; render(); }); });

      if (!db) {
        state.addPlaceError = '目前連不上資料庫，請檢查網路連線後再試一次';
        render();
        return;
      }
      state.newPlace = { name: name, url: url, note: note };
      addPlace(name.trim(), url.trim(), note.trim());
    });

  // ---------------------------------------------------------------------
  // Swipe handling for the drawer
  // ---------------------------------------------------------------------
  function bindSwipeOpen(el) {
    var startX = null;
    el.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
    el.addEventListener('touchend', function (e) {
      if (startX === null) return;
      var endX = e.changedTouches[0].clientX;
      if (endX - startX > 45) { state.drawerOpen = true; render(); }
      startX = null;
    }, { passive: true });
  }
  function bindSwipeClose(el) {
    var startX = null;
    el.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
    el.addEventListener('touchend', function (e) {
      if (startX === null) return;
      var endX = e.changedTouches[0].clientX;
      if (startX - endX > 45) { state.drawerOpen = false; render(); }
      startX = null;
    }, { passive: true });
  }

  // ---------------------------------------------------------------------
  // Drag-to-reorder for places (touch-based)
  // ---------------------------------------------------------------------
  function bindDragHandle(handleEl) {
    var placeId = handleEl.getAttribute('data-drag-handle');
    handleEl.addEventListener('touchstart', function (e) {
      e.preventDefault();
      var list = document.getElementById('placesList');
      if (!list) return;
      var rows = Array.prototype.slice.call(list.children);
      var startY = e.touches[0].clientY;
      var rowHeight = rows[0] ? rows[0].getBoundingClientRect().height + 7 : 60;
      var dayPlaces = state.places.filter(function (p) { return p.dayId === state.activeDayId; }).sort(function (a, b) { return a.order - b.order; });
      var curIndex = dayPlaces.map(function (p) { return p.id; }).indexOf(placeId);
      state.dragPlaceId = placeId;
      render();

      function onMove(ev) {
        var y = ev.touches[0].clientY;
        var delta = y - startY;
        var steps = Math.round(delta / rowHeight);
        var newIndex = curIndex + steps;
        if (newIndex < 0) newIndex = 0;
        if (newIndex > dayPlaces.length - 1) newIndex = dayPlaces.length - 1;
        if (newIndex !== curIndex) {
          var moved = dayPlaces.splice(curIndex, 1)[0];
          dayPlaces.splice(newIndex, 0, moved);
          curIndex = newIndex;
          startY = y;
          renderPlacesListOnly(dayPlaces);
        }
      }
      function onEnd() {
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
        state.dragPlaceId = null;
        commitPlacesOrder(dayPlaces);
      }
      document.addEventListener('touchmove', onMove, { passive: true });
      document.addEventListener('touchend', onEnd, { passive: true });
    }, { passive: false });
  }

  function renderPlacesListOnly(dayPlaces) {
    var list = document.getElementById('placesList');
    if (!list) return;
    list.innerHTML = dayPlaces.map(function (p, idx) {
      var dragCls = state.dragPlaceId === p.id ? ' dragging' : '';
      return '<div class="place-row' + dragCls + '" data-place-id="' + p.id + '" data-idx="' + idx + '">' +
        '<div class="drag-handle" data-drag-handle="' + p.id + '">' + ICO.drag + '</div>' +
        '<a href="' + esc(p.url) + '" target="_blank" rel="noopener" style="flex-grow:1;min-width:0;">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">' +
            '<div style="font-size:12.5px;font-weight:700;color:#4A3626;">' + esc(p.name) + '</div>' + ICO.pinSmall +
          '</div>' +
          '<div style="font-size:10.5px;color:#A6875F;line-height:1.5;margin-top:4px;">' + esc(p.note) + '</div>' +
        '</a>' +
        '<button data-del-place="' + p.id + '" style="flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#F6E2DC;border:none;display:flex;align-items:center;justify-content:center;">' + ICO.xSmall + '</button>' +
      '</div>';
    }).join('<div style="height:7px;"></div>');
    Array.prototype.forEach.call(list.querySelectorAll('[data-drag-handle]'), function (el) { bindDragHandle(el); });
    Array.prototype.forEach.call(list.querySelectorAll('[data-del-place]'), function (el) {
      el.addEventListener('click', function (e) { e.preventDefault(); state.confirmDeletePlaceId = el.getAttribute('data-del-place'); render(); });
    });
  }

  // ---------------------------------------------------------------------
  // DB-backed actions
  // ---------------------------------------------------------------------
  function addPlace(name, url, note) {
    if (!db) { state.addPlaceError = '目前連不上資料庫，請檢查網路連線'; render(); return; }
    var dayPlaces = state.places.filter(function (p) { return p.dayId === state.activeDayId; });
    var maxOrder = dayPlaces.reduce(function (m, p) { return Math.max(m, p.order); }, -1);
    db.collection('places').add({ dayId: state.activeDayId, name: name, url: url || '', note: note || '', order: maxOrder + 1 })
      .then(function () {
        state.addPlaceOpen = false;
        state.addPlaceError = '';
        render();
      })
      .catch(function (err) {
        noteDbError('addPlace 失敗', err);
        state.addPlaceError = '新增失敗（' + (err && err.code ? err.code : '未知錯誤') + '），請確認Firestore規則允許寫入';
        render();
      });
  }
  function deletePlace(id) {
    if (!db || !id) return;
    db.doc('places/' + id).delete().catch(function (err) { noteDbError('deletePlace 失敗', err); });
  }
  function commitPlacesOrder(orderedList) {
    if (!db) { render(); return; }
    orderedList.forEach(function (p, idx) {
      if (p.order !== idx) { db.doc('places/' + p.id).update({ order: idx }).catch(function (err) { noteDbError('reorder 失敗', err); }); }
    });
    render();
  }
  function addChecklistItem() {
    if (!db) return;
    var dayItems = state.checklist.filter(function (c) { return c.dayId === state.activeDayId; });
    var minOrder = dayItems.reduce(function (m, c) { return Math.min(m, c.order); }, 0);
    db.collection('checklist').add({ dayId: state.activeDayId, label: '', checked: false, order: minOrder - 1 })
      .then(function (ref) { state.editingChecklistId = ref.id; state.editingChecklistText = ''; render();
        var inp = document.getElementById('editChecklistInput'); if (inp) { inp.focus(); } })
      .catch(function (err) { noteDbError('addChecklistItem 失敗', err); });
  }
  function toggleChecklist(id) {
    if (!db) return;
    var item = state.checklist.filter(function (c) { return c.id === id; })[0];
    if (!item) return;
    db.doc('checklist/' + id).update({ checked: !item.checked }).catch(function (err) { noteDbError('toggle 失敗', err); });
  }
  function commitChecklistEdit(text) {
    var id = state.editingChecklistId;
    state.editingChecklistId = null;
    if (!db || !id) { render(); return; }
    db.doc('checklist/' + id).update({ label: text }).catch(function (err) { noteDbError('edit 失敗', err); });
    render();
  }

  function explainDbError(err) {
    var code = (err && (err.code || err.message)) ? String(err.code || err.message) : '未知錯誤';
    var hint = '';
    if (/operation-not-allowed|admin-restricted/.test(code)) hint = '請到Firebase主控台 → Authentication → Sign-in method 啟用「匿名」';
    else if (/permission-denied|insufficient permissions/i.test(code)) hint = '請確認Firestore規則允許已登入者讀寫';
    else if (/unauthorized-domain/.test(code)) hint = '請把這個網址的網域加入Firebase「授權網域」';
    else if (/network|unavailable|offline/i.test(code)) hint = '請檢查網路連線';
    else if (/failed-precondition|not-found/.test(code)) hint = '請確認已在Firebase建立Firestore資料庫';
    return hint ? hint + '（' + code + '）' : code;
  }
  function noteDbError(what, err) {
    console.error(what, err);
    state.dbError = what + '：' + explainDbError(err);
    render();
  }

  function seedIfEmpty(colName, seedRows) {
    return db.collection(colName).limit(1).get().then(function (snap) {
      if (!snap.empty) return;
      var batch = db.batch();
      seedRows.forEach(function (row) {
        var id = row.id;
        var data = {};
        Object.keys(row).forEach(function (k) { if (k !== 'id') data[k] = row[k]; });
        batch.set(db.collection(colName).doc(id), data);
      });
      return batch.commit();
    });
  }

  function initDb() {
    if (!window.firebase) { state.dbChecked = true; noteDbError('Firebase SDK 載入失敗', { code: 'sdk-not-loaded' }); return; }
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
    } catch (e) { state.dbChecked = true; noteDbError('Firebase 初始化失敗', e); return; }
    firebase.auth().signInAnonymously().then(function () {
      db = firebase.firestore();
      state.dbChecked = true;
      state.dbReady = true;
      return Promise.all([seedIfEmpty('places', SEED_PLACES), seedIfEmpty('checklist', SEED_CHECKLIST)]);
    }).then(function () {
      unsubPlaces = db.collection('places').onSnapshot(function (snap) {
        state.places = snapshotToList(snap);
        render();
      }, function (err) { noteDbError('讀取景點失敗', err); });

        state.checklist = snapshotToList(snap);
        render();
      }, function (err) { noteDbError('讀取清單失敗', err); });
      render();
    }).catch(function (err) {
      state.dbChecked = true;
      noteDbError('資料庫連線失敗', err);
    });
  }
